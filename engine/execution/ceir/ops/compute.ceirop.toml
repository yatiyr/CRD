schema_version = 1
dialect = "compute"
summary = "CEIR-13a sec-42 ceir.compute: ordinary kernel launches -- direct + indirect dispatch, dynamic dispatch dimensions, kernel resource binding. HOST-authorable op vocabulary (ADR-0109): the ops live in crd-ceir; the crd-ceir-gpu BRIDGE lowers them onto the canonical command model / IComputeContext at CEIR-13d (crd-ceir core NEVER links gpu-context -- I3/I4). The kernel is referenced BY IDENTITY (a `kernel` symbol). ⭐ CEIR-13c LANDED: `[op.kernel_ref]` marks `kernel`+`kernel_interface` as the KernelRef {asset_id, interface_hash}; collect_dependencies extracts it as a ckir_ref; the cook's `KernelResolveFn` resolves the identity (through the ADR-0104 cache in production) + checks the pinned interface hash (KernelUnresolved / KernelInterfaceMismatch). The STRUCTURAL bindings-vs-kernel-params check is named-forward to 13z/kir-side. Binding KIND is DERIVED from each binding operand's CEIR-3c TYPE (Buffer -> storage buffer, Image -> texture, View -> its underlying members[0]) -- NO separate kind attr (ONE source of truth, the 12a doctrine); the SLOT is the binding's POSITIONAL index; the ACCESS rides the `access` string. ⛔ effects are a CONSERVATIVE BASELINE here (GPUCommand + ambient MemoryReadWrite): a dispatch may touch any bound memory, so it MUST hazard against exports / transfers / host-memory ops (the more-hazards-never-fewer rule -- else a dispatch and the export of its own output read as freely reorderable); CEIR-13d NARROWS the ambient to per-binding MemoryRead/Write derived from `access` + emits the barrier pass. Dispatch ops are RESULTLESS -- ordering is effect-derived (the command-stream model 13d lowers to); async composition wraps at ceir.async if ever needed. Well-formedness (access arity/tokens, binding-is-resource, grid-is-index, args-is-buffer) rides the module-walk verifier Context::find_dispatch_misuse. ⛔ NO-FOLLOW (named, never silently subset): sec-42's persistent kernels + cooperative launches + dispatch groups/grids -> CEIR-13+/26; UNIFORM-buffer bindings (BufferMode has no Uniform mode; the sec-129 proof kernels bind STORAGE buffers) -> 13d/render; BindingFrequency (descriptor-set UPDATE frequency, a lowering concept) -> 13d/render."

# ----------------------------------------------------------------------------------------------------------------------
# compute.dispatch -- a DIRECT compute dispatch: launch @kernel over a (gx, gy, gz) workgroup grid with the bound
# resources. Grid dims are RUNTIME index operands (dynamic dispatch dims, sec-42); a compile-time grid is just an
# arith.const operand. Bindings are the variadic tail (SLOT order); each binding's ACCESS is the matching `access` token,
# its KIND derives from its type. ⛔ operand order: grid (0..2) FIRST, then the variadic bindings (opgen: only the LAST
# operand may be variadic).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "dispatch"
summary = "A direct compute dispatch: launch @kernel over a (gx, gy, gz) workgroup grid with the bound resources."
version = 1
operands = [
    { name = "grid_x", type = "index", doc = "workgroup count in X (a runtime index -- dynamic dispatch dims, sec-42)" },
    { name = "grid_y", type = "index", doc = "workgroup count in Y" },
    { name = "grid_z", type = "index", doc = "workgroup count in Z" },
    { name = "bindings", type = "resource", variadic = true, doc = "the kernel's bound resources, in SLOT order; each binding's ACCESS is the matching `access` token, its KIND is derived from its CEIR-3c type" },
]
attributes = [
    { name = "kernel", kind = "symbol", required = true, doc = "the kernel asset identity (@kernel); CEIR-13c: collect_dependencies extracts it as a ckir_ref, the cook's KernelResolveFn resolves it by content-hash + checks the kernel_interface pin. ⛔ identity is LOAD-BEARING: an absent/non-symbol kernel is KernelNotSymbol (find_dispatch_misuse) / KernelUnresolved (cook)" },
    { name = "access", kind = "string", required = true, doc = "per-binding access: comma-separated {r|w|rw} in operand order, one token per binding (empty string = zero bindings). find_dispatch_misuse checks token-count == num bindings and each token in {r,w,rw}" },
    { name = "kernel_interface", kind = "int", required = false, doc = "CEIR-13c the EXPECTED §107 interface hash of @kernel (a PIN, the u64 stored as its i64 bit pattern; absent = unpinned, a dependency-only ref). At cook the resolved kernel's actual interface hash is checked against this pin (KernelInterfaceMismatch)" },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
kernel_ref = { symbol = "kernel", interface = "kernel_interface" }
docs = "compute.dispatch(%gx, %gy, %gz, %bindings...) {kernel=@k, access=\"...\", kernel_interface=H}. A direct dispatch, RESULTLESS. Effects: GPUCommand + a CONSERVATIVE ambient MemoryReadWrite (13d narrows to per-binding from `access`). CEIR-13c: [op.kernel_ref] marks `kernel` as the CKIR asset identity + `kernel_interface` as the expected interface-hash pin (collect_dependencies extracts the ckir_ref SCHEMA-DRIVEN). find_dispatch_misuse: grid operands (0..2) Index-typed; access-token-count == num_operands-3; each token in {r,w,rw}; each binding (operands 3..) resource-kinded."

# ----------------------------------------------------------------------------------------------------------------------
# compute.dispatch_indirect -- an INDIRECT compute dispatch: the (gx, gy, gz) workgroup counts are read from an args
# buffer (GPU-side), not passed as operands. Args FIRST, then the variadic bindings. Carries a static MemoryRead on the
# args buffer (always read -- survives the 13d narrowing) on top of the conservative baseline.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "dispatch_indirect"
summary = "An indirect compute dispatch: launch @kernel with the workgroup grid read from an args buffer, with the bound resources."
version = 1
operands = [
    { name = "args", type = "resource", doc = "the indirect-args buffer holding the (gx, gy, gz) workgroup counts (read GPU-side)" },
    { name = "bindings", type = "resource", variadic = true, doc = "the kernel's bound resources, in SLOT order (as compute.dispatch)" },
]
attributes = [
    { name = "kernel", kind = "symbol", required = true, doc = "the kernel asset identity (@kernel); CEIR-13c: extracted as a ckir_ref + resolved/pin-checked by the cook's KernelResolveFn (absent/non-symbol = KernelNotSymbol / KernelUnresolved)" },
    { name = "access", kind = "string", required = true, doc = "per-binding access: comma-separated {r|w|rw}, one token per binding (empty = zero bindings)" },
    { name = "kernel_interface", kind = "int", required = false, doc = "CEIR-13c the EXPECTED §107 interface hash of @kernel (a PIN, u64 as i64 bit pattern; absent = unpinned). Checked vs the resolved kernel at cook (KernelInterfaceMismatch)" },
]
effects = [ "GPUCommand", "MemoryReadWrite", { family = "MemoryRead", operand = 0 } ]
kernel_ref = { symbol = "kernel", interface = "kernel_interface" }
docs = "compute.dispatch_indirect(%args, %bindings...) {kernel=@k, access=\"...\", kernel_interface=H}. An indirect dispatch (dims read from %args), RESULTLESS. Effects: GPUCommand + ambient MemoryReadWrite + a static MemoryRead on %args (always read; survives the 13d narrowing). CEIR-13c: [op.kernel_ref] {kernel, kernel_interface}. find_dispatch_misuse: args (operand 0) a Buffer or View-of-buffer; access-token-count == num_operands-1; each token in {r,w,rw}; each binding (operands 1..) resource-kinded."
