schema_version = 1
dialect = "input"
summary = "DIAG.9a host inputs a program reads: values the host delivers at run time through its input seam (crd/ceir/input.hpp), so a run record can hold them and a replay can feed them back. Each op names one input kind and carries that kind's own effect family, so the replay-input analysis classifies it without a special case. A host with no source for a kind fails the read with a typed InputUnavailable error, never a made-up value."

# ----------------------------------------------------------------------------------------------------------------------
# input.random -- one draw from the host's random stream `stream`, reduced to [0, bound). The host delivers the raw
# 64-bit draw (InputSource, kind Random); the op reduces it (unsigned remainder by `bound`), so the reduction is program
# semantics and a replay of the same raw draws against an edited bound sees what the edited program would see. A draw
# ADVANCES its stream (RandomRead writes the Random class in hazard.hpp), so two draws never reorder. A read is a
# schedule-dependent input exactly like a §20 cell: a parallel or pooled body may not contain one (exec::region_state_free).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "random"
summary = "Draw the next value of a host random stream, reduced to [0, bound)."
version = 1
results = [
    { name = "value", type = "any", doc = "the draw reduced to [0, bound) (an integer)" },
]
attributes = [
    { name = "stream", kind = "int", required = true, doc = "the host random stream to draw from, in [0, 2^32). Streams are independent: a draw from one never advances another." },
    { name = "bound", kind = "int", required = true, doc = "the exclusive upper bound of the result, in [1, 2^32). The raw draw is reduced by unsigned remainder." },
]
effects = [ "RandomRead" ]
determinism = "ExternalNondeterminism"
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = true }
docs = "input.random {stream = S, bound = B} -> %v. The host's input seam delivers the raw draw of stream S (InputSource, InputKind::Random); %v = draw mod B (unsigned). Deterministic given the host's stream (a seeded host, or a run record's recorded draws), which the host chooses externally. With no source for the stream the read fails ExecError::InputUnavailable / plan::RunError::InputUnavailable. A stream or bound out of range is the arith.const precedent: ExecError::UndefinedValue at eval, CompileError::BadConst at plan compile. Not legal in a parallel_for / map_reduce body or a pooled launch body (a draw order would depend on the schedule): the shared pre-flight refuses it as ParallelBodyStateful, and a launch body that reads one runs inline on the submitting thread."

# ----------------------------------------------------------------------------------------------------------------------
# input.clock / input.time_step -- the host's current reading of one time domain, and the length of that domain's
# current step. `domain` names one of the time dialect's six built-in domains (crd/ceir/time.hpp: wall, sim, frame,
# audio_sample, sequencer, logical); the seam's channel is that domain's ordinal in that list. Units, per domain:
# wall and sim are nanoseconds; frame, audio_sample, sequencer and logical are counts of that domain's own ticks. The
# wall domain is the host's MONOTONIC clock measured from the host clock's own epoch (when its source was made), never
# calendar time, so a record names no date and no machine. A time step is in the same unit as its domain's reading.
# The host delivers the raw value (InputSource, kinds Clock and TimeStep); the op applies no reduction. TimeRead is a
# pure read in the hazard classification: nothing reorders ops between cook and execution today (both executors run a
# block in list order), and a replay runs the record's own blob, so the read order a record keeps is the order it
# feeds back. Like input.random, a read is schedule-dependent: a parallel or pooled body may not contain one.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "clock"
summary = "Read the host's current time in one time domain."
version = 1
results = [
    { name = "now", type = "any", doc = "the domain's current reading (an integer): nanoseconds for wall and sim, ticks of the domain otherwise" },
]
attributes = [
    { name = "domain", kind = "string", required = true, doc = "the time domain to read: wall, sim, frame, audio_sample, sequencer or logical (the time dialect's built-ins). wall is the host's monotonic clock since its own epoch, never calendar time." },
]
effects = [ "TimeRead" ]
determinism = "ExternalNondeterminism"
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = true }
docs = "input.clock {domain = D} -> %t. The host's input seam delivers domain D's current reading (InputSource, InputKind::Clock, channel = D's ordinal among the time dialect's built-in domains) and %t is that raw value: nanoseconds for wall (monotonic, from the host clock's epoch, never calendar time) and sim, a tick count for frame, audio_sample, sequencer and logical. With no reading for D the read fails ExecError::InputUnavailable / plan::RunError::InputUnavailable. A domain that is absent, not a string or not a built-in is the arith.const precedent: ExecError::UndefinedValue at eval, CompileError::BadConst at plan compile. Not legal in a parallel_for / map_reduce body or a pooled launch body (ParallelBodyStateful); a launch body that reads one runs inline."

[[op]]
name = "time_step"
summary = "Read the length of the current step of one time domain."
version = 1
results = [
    { name = "step", type = "any", doc = "the length of the domain's current step (an integer), in the domain's own unit" },
]
attributes = [
    { name = "domain", kind = "string", required = true, doc = "the time domain whose step to read: wall, sim, frame, audio_sample, sequencer or logical (the time dialect's built-ins)." },
]
effects = [ "TimeRead" ]
determinism = "ExternalNondeterminism"
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = true }
docs = "input.time_step {domain = D} -> %dt. The host's input seam delivers the length of domain D's current step (InputSource, InputKind::TimeStep, channel = D's ordinal among the time dialect's built-in domains), in D's unit: nanoseconds for wall and sim, ticks otherwise. With no step for D the read fails ExecError::InputUnavailable / plan::RunError::InputUnavailable. A bad domain is ExecError::UndefinedValue at eval and CompileError::BadConst at plan compile. Not legal in a parallel_for / map_reduce body or a pooled launch body (ParallelBodyStateful); a launch body that reads one runs inline."
