# ceir.task -- host/job execution ops (sec 38, the sec 31 host-job/fiber integration). CEIR-6b: `parallel_for`, the
# data-parallel counted loop. ⛔ HOST-ONLY VOCABULARY here (ADR-0109): the OPS are host-authorable and live in crd-ceir;
# the crd-jobs PROVIDER that lowers them onto crd::jobs::parallel_for lives in the crd-ceir-host BRIDGE (crd-ceir never
# link-edges to crd-jobs). CEIR-6z adds `map_reduce` -- the in-IR fixed-order reduction (the band-6 gate). sec 38's
# residual SIX ops -- spawn / continuation / main-thread / worker / fiber-wait / task-group -- LANDED at CEIR-11a (the
# sec 84 async-host subset; routed at 6z); jobs-backed launch/await ON-POOL is CEIR-11a stage 3; PRIORITY landed at CEIR-6c (RealtimeClass->jobs::Priority in the
# bridge), DEADLINE -> CEIR-21/26 (no crd-jobs deadline primitive). NO-FOLLOW: named, never silently subset.
schema_version = 1
dialect = "task"
summary = "Host/job execution ops (sec 38): the data-parallel loop (parallel_for) + the fixed-order map_reduce, lowered onto crd-jobs by the crd-ceir-host bridge."

[[op]]
name = "parallel_for"
summary = "A data-parallel counted loop: run the body region for each index in [lower, upper) stepping by step, on the host job provider."
version = 1
operands = [ { name = "lower", type = "any" }, { name = "upper", type = "any" }, { name = "step", type = "any" } ]
regions = [ { kind = "graph", args = [ { name = "iv", type_hint = "the induction variable (an index) for this parallel iteration" } ] } ]
effects = ["Synchronization"]
docs = "task.parallel_for(%lo, %hi, %step) { ^body(%iv): ... core.yield %v }. ⛔ HOST PROVIDER (crd-ceir-host, CEIR-6b): lowered to crd::jobs::parallel_for -- each index runs the body via a FRESH interpreter (per-range, from a prototype) over the shared CONST Context; the per-index yield is collected into the provider's map buffer (IExecutionProvider::map_output). ⛔ PARALLEL PURITY (pre-flight-enforced on the submitting thread): the body AND its resolved callees must be STATE-FREE (no StateEdge cell -- a cell would make results depend on the range split, destroying the {1..16} bit-identity) and yield EXACTLY one value (arg: %iv). ⛔ The body must also be SELF-CONTAINED: it uses only its block-arg (%iv) + body-local defs (inline consts) + self-contained calls -- OUTER captures are NOT seeded into the per-index interpreters (a captured value is an UndefinedValue at execution); capture-seeding is a named later refinement. The in-IR reduction is task.map_reduce -- CEIR-6z. Declares an ambient Synchronization effect (it blocks on a jobs counter) -> illegal in an audio-real-time region (the 6a flip); determinism Unspecified (fails Deterministic mode, honestly -- the 6a finding)."

[[op]]
name = "map_reduce"
summary = "A data-parallel map + a fixed-order (index-order) reduction: map each index in [lower, upper) via the map region, then fold the results left-to-right from init via the combine region."
version = 1
operands = [ { name = "lower", type = "any" }, { name = "upper", type = "any" }, { name = "step", type = "any" }, { name = "init", type = "any" } ]
results = [ { name = "result", type = "any", doc = "the reduced value (init folded over the map results in index order)" } ]
regions = [ { kind = "graph", args = [ { name = "iv", type_hint = "the induction variable (an index) for this parallel map iteration" } ] }, { kind = "graph", args = [ { name = "acc", type_hint = "the reduction accumulator (init on the first fold step)" }, { name = "elem", type_hint = "the map result at the current index" } ] } ]
effects = ["Synchronization"]
docs = "task.map_reduce(%lo, %hi, %step, %init) map { ^m(%iv): ... core.yield %v } combine { ^c(%acc, %elem): ... core.yield %next } -> %result. ⛔ HOST PROVIDER (crd-ceir-host, CEIR-6z): the MAP region runs in PARALLEL (crd::jobs::parallel_for -- fresh per-item interpreters over the shared const Context, disjoint index-order output slots, exactly as task.parallel_for); the COMBINE region then folds those results SEQUENTIALLY in INDEX ORDER (acc = init; acc = combine(acc, out[i]) for i = 0..count) on ONE fresh sub-interpreter. ⭐ The result is num_jobs-INDEPENDENT and BIT-IDENTICAL across {1..16}: the map output is index-order-disjoint (split-independent) and the fold order is FIXED (index order), so even a NON-associative combine is deterministic -- the sec 30/sec 31 band-6 gate. ⛔ PARALLEL PURITY (pre-flight): BOTH regions state-free (no StateEdge, transitively) + self-contained; the map yields EXACTLY 1 (arg: %iv), the combine yields EXACTLY 1 (args: %acc, %elem -- arg count checked so invoke_region's block-arg bind never reads OOB). Declares an ambient Synchronization effect (it blocks on a jobs counter) -> illegal in an audio-real-time region (the 6a flip); determinism Unspecified. The map output is also stashed for IExecutionProvider::map_output inspection (sec 118 parity)."

# ─────────────────────────── CEIR-11a: sec 38's residual SIX task ops (async-host subset) ───────────────────────────
# The LAYERING INVARIANT (advisor): ceir.async states concurrency STRUCTURE (no execution commitment -- any provider must
# honor it); ceir.task states HOST/JOB PLACEMENT + execution semantics. In the REFERENCE tier spawn/main_thread/worker
# share eval_launch and group shares eval_scope (distinct vocabulary, shared EvalFn -- the state/delay/history + switch/
# match precedent); the placement distinction lives in the crd-ceir-host tier (jobs-backed, CEIR-11a stage 3). NONE is
# Nondeterministic (only async.race's VALUE is scheduling-dependent). Tokens stay TRAIT-typed (TokenProducer/Consumer).

[[op]]
name = "spawn"
summary = "Fork a body as a host job; produce a completion token (the sec 38 task-level fork)."
version = 1
results = [ { name = "token", type = "any", doc = "the completion token -- consume EXACTLY once (await / fiber_wait / join / cancel)" } ]
regions = [ { kind = "graph" } ]
traits = ["TokenProducer"]
effects = ["Synchronization"]
docs = "task.spawn { body } -> %token. Fork the body as a HOST JOB (vs async.launch, which commits to no substrate). ⛔ EXECUTOR CONTRACT: the SEQUENTIAL reference shares async.launch's EvalFn (runs the body at spawn; %token completes at the body's yield); the JOBS-BACKED provider (CEIR-11a stage 3) lowers to crd::jobs::run(JobDecl). Declares an ambient Synchronization effect -> illegal in an audio-real-time region (the 6a flip). Token use-once (sec 116) is enforced by the SHARED find_token_misuse verifier -- ZERO verifier edits (open-world)."

[[op]]
name = "continuation"
summary = "Run a body AFTER a token completes, receiving its values; produce a new token (the sec 37 dependency / 'then')."
version = 1
operands = [ { name = "token", type = "any", doc = "the antecedent token to consume" } ]
results = [ { name = "next", type = "any", doc = "a new completion token for the continuation body" } ]
regions = [ { kind = "graph", args = [ { name = "value", type_hint = "a value yielded by the antecedent (variadic; bound as block-args in antecedent-yield order)" } ] } ]
traits = ["TokenConsumer", "TokenProducer"]
effects = ["Synchronization"]
docs = "task.continuation(%token) { ^body(%vals...): ... core.yield %next... } -> %token2. Consumes %token ONCE (TokenConsumer) and runs the body AFTER it completes, binding the antecedent's yielded values as the body's block-args; produces a NEW token (TokenProducer) carrying the body's yields -- the sec 37 dependency chain ('then'). ⛔ EXECUTOR CONTRACT: the SEQUENTIAL reference reads the antecedent's stored yields, binds them via invoke_region, and stores the body's yields as the new token (an arity mismatch is a runtime BadArity -- the invoke_region contract; static cross-op yield-count checking is a semantic-verifier question, CEIR-3/4). Jobs-backed: run-after-wait (stage 3). Synchronization -> audio-RT illegal."

[[op]]
name = "main_thread"
summary = "Run a body pinned to the main thread (thread 0); produce a completion token."
version = 1
results = [ { name = "token", type = "any", doc = "the completion token -- consume EXACTLY once" } ]
regions = [ { kind = "graph" } ]
traits = ["TokenProducer"]
effects = ["Synchronization"]
docs = "task.main_thread { body } -> %token. Run the body pinned to the MAIN THREAD (thread 0 -- for main-thread-affine work). ⛔ EXECUTOR CONTRACT: main-thread PLACEMENT is value-unobservable in the sec 118 oracle, so the SEQUENTIAL reference shares async.launch's EvalFn (runs the body at the op, correct for the oracle); the JOBS-BACKED provider lowers to crd::jobs::run with JobDecl.pin_thread=0 + pump_main_thread (stage 3). Synchronization -> audio-RT illegal. Token use-once via the shared verifier."

[[op]]
name = "worker"
summary = "Run a body on a worker thread (worker-pool affinity); produce a completion token."
version = 1
results = [ { name = "token", type = "any", doc = "the completion token -- consume EXACTLY once" } ]
regions = [ { kind = "graph" } ]
traits = ["TokenProducer"]
effects = ["Synchronization"]
docs = "task.worker { body } -> %token. Run the body on a WORKER thread (the default pool). ⛔ EXECUTOR CONTRACT: worker PLACEMENT is value-unobservable in the oracle, so the SEQUENTIAL reference shares async.launch's EvalFn (runs on the calling thread, correct for the oracle); the JOBS-BACKED provider lowers to crd::jobs::run(JobDecl) (stage 3). Synchronization -> audio-RT illegal. Token use-once via the shared verifier."

[[op]]
name = "fiber_wait"
summary = "Fiber-yielding wait on a token; produce the awaited body's yielded values (host-level await)."
version = 1
operands = [ { name = "token", type = "any", doc = "the token to consume" } ]
results = [ { name = "values", type = "any", variadic = true, doc = "the awaited body's yielded values" } ]
traits = ["TokenConsumer"]
effects = ["Synchronization"]
docs = "task.fiber_wait(%token) -> (%v...). The HOST-level await: consume %token ONCE and yield the awaited body's values, ⛔ YIELDING THE FIBER (never blocking the thread) -- vs async.await (the substrate-neutral structural wait). EXECUTOR CONTRACT: the SEQUENTIAL reference mirrors async.await's EvalFn (returns the body's stored yields); the JOBS-BACKED provider lowers to crd::jobs::wait(counter) (stage 3). Synchronization -> audio-RT illegal."

[[op]]
name = "group"
summary = "A structured task group: bound a region so every task spawned inside is joined at group exit (the task-level scope)."
version = 1
results = [ { name = "results", type = "any", variadic = true, doc = "the group region's yielded values" } ]
regions = [ { kind = "graph" } ]
effects = ["Synchronization"]
docs = "task.group { ... } -> (%r...). A structured TASK GROUP (sec 38): its dynamic extent ends only when every task spawned inside is joined -- the task-level counterpart of async.scope. ⛔ It BOUNDS, it does NOT fork, so it carries NO token traits (a token spawned inside + consumed outside is UseBeforeDef by 5b; never-consumed is Unconsumed by 6a -- confinement is LAYERED verification, zero new code, exactly like async.scope). EXECUTOR CONTRACT: the SEQUENTIAL reference shares async.scope's EvalFn (a no-op boundary forwarding the region's yield -- everything already completed at spawn); the JOBS-BACKED provider joins outstanding work at group exit via crd::jobs::run(span)+wait (stage 3). Synchronization -> audio-RT illegal (a join-at-exit blocks)."
