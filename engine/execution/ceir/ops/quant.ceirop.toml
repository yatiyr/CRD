schema_version = 1
dialect = "quant"
summary = "CEIR-23a sec-54 ceir.quant: QUANTIZATION SEMANTICS as first-class IR — quantize (float -> integer-storage) + dequantize (integer-storage -> float), so a provider may fuse dequant into loads / emit a native Q8 program (sec-54 'quantization/dequantization may be fused into loads/provider programs'; important for ML + neural rendering). ⛔ NO new element TypeKind (the split-complex precedent: a quantized element kind carries the 21c identity-ripple cost) — the STORAGE type RIDES the result type (quantize's result is an INTEGER-element tensor via type_int(width,signed); the 21b target-rides-result doctrine) and the EXPRESSED type rides dequantize's float result. ⛔ scale + zero_point are OPERANDS, not attrs (ATTR_KINDS has no array kind — the transpose-perm precedent): a PER-TENSOR scale is a RANK-0 tensor, PER-AXIS is RANK-1, ONE op form covers both (the design-B rank-0 binding precedent). ⛔ EVERY op is Pure + typed NoSemantics + carries NO kernel_ref / NO lowering hook (sec-70; the ckir/native-Q8-provider mapping lands at 23b, NOT here) — declare stays ELEMENT-AGNOSTIC (Q8/INT8/4/2/FP8-specific restriction rides the 23b provider as typed SynthRejects, the 22a/22b split). ⛔ NO-FOLLOW / NAME-FORWARD (declared != implemented; a later band with a real consumer, never a silent subset): packed low-bit formats (INT4/2 sub-byte packing) / FP8 element / calibration metadata (sec-54) -> named-forward (no consumer this band, the 12a rule); block-quantized dtypes -> the sparse/provider rows. ⛔ I6 — find_quant_misuse switches on op NAME + TypeKind, never op.kind. crd-ceir NEVER links gpu-context (I3/I4); ZERO renderer changes."

# ----------------------------------------------------------------------------------------------------------------------
# quant.quantize -- FLOAT -> INTEGER-STORAGE: output[i] = clamp(round(input[i] / scale) + zero_point) in the storage int
# range. `scale` (float) and `zero_point` (integer, the storage domain) are RANK-0 (per-tensor) or RANK-1 (per-axis, indexed
# by `axis`). The STORAGE integer element rides the RESULT type (element-agnostic declare; the provider restricts to Q8 etc).
# Pure, NoSemantics (the provider maps it at 23b). find_quant_misuse: operands+result Tensor-kinded; output.shape ==
# input.shape; scale.shape == zero_point.shape; scale rank 0|1 (rank-1 => axis in [0,rank) AND scale.dim0 == input.dim[axis]);
# scale.element == input.element (the FLOAT/value side); zero_point.element == output.element (the INTEGER/storage side);
# `scheme` in {symmetric,asymmetric}.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "quantize"
summary = "Float -> integer-storage quantization: output = round(input/scale) + zero_point (per-tensor rank-0 or per-axis rank-1 scale/zero_point)."
version = 1
operands = [
    { name = "input", type = "tensor", doc = "the FLOAT values to quantize (a 3d Tensor); its element is the value/expressed type." },
    { name = "scale", type = "tensor", doc = "the FLOAT scale; RANK-0 (per-tensor) or RANK-1 (per-axis over `axis`, size == input.dim[axis]); its element == input's." },
    { name = "zero_point", type = "tensor", doc = "the INTEGER zero-point in the storage domain; same shape as `scale`; its element == the output's (storage) element." },
]
results = [
    { name = "output", type = "tensor", doc = "the INTEGER-storage result; element = the storage int type (type_int(width,signed) — rides the result, e.g. i8 for Q8); shape == input's." },
]
attributes = [
    { name = "axis", kind = "int", required = true, doc = "the per-axis quantization axis (>=0, < input rank); MEANINGFUL iff scale is RANK-1 (per-axis) — for a RANK-0 (per-tensor) scale it is unconstrained. find_quant_misuse: with a rank-1 scale, axis in [0,rank) and scale.dim0 == input.dim[axis]." },
    { name = "scheme", kind = "string", required = true, doc = "the quantization scheme, a CLOSED vocab: symmetric | asymmetric (symmetric => zero_point is 0 by convention; the provider may assume it). find_quant_misuse rejects any other token (SchemeInvalid)." },
]
traits = ["Pure"]
docs = "quant.quantize(%input, %scale, %zero_point) {axis, scheme} -> %output. Float -> integer-storage quantization (sec-54). ⛔ NO new TypeKind — the storage int type RIDES the result (21b target-rides-result); scale/zero_point are OPERANDS (rank-0 per-tensor / rank-1 per-axis, ONE form). Pure, NO kernel_ref (the Q8/native provider maps at 23b). find_quant_misuse: input,scale,zero_point operands + output result Tensor-kinded (OperandNotTensor / ResultNotTensor); output.shape == input.shape (ShapeMismatch); scale.shape == zero_point.shape (ScaleZeroPointMismatch); scale rank 0 or 1 (ScaleRankInvalid); a rank-1 scale => `axis` in [0, input rank) and scale.dim0 == input.dim[axis] (AxisScaleMismatch); scale.element == input.element (the value/float side, ScaleElementMismatch); zero_point.element == output.element (the storage/int side, ZeroPointElementMismatch); `scheme` in {symmetric,asymmetric} (SchemeInvalid). ⛔ the FLOAT-input + INTEGER-output + Q8-specific restriction rides the 23b provider (name-forward, the 22a precedent). STRUCTURAL (3 operands, 1 result, `axis` present+Int, `scheme` present+String): the generated verify_quantize."

# ----------------------------------------------------------------------------------------------------------------------
# quant.dequantize -- INTEGER-STORAGE -> FLOAT: output[i] = (input[i] - zero_point) * scale. The mirror of quantize; the
# EXPRESSED float element rides the result. sec-54's 'fused into loads/provider programs' is a 23b provider window
# (dequantize -> gemm), NOT a lowering hook here. find_quant_misuse: as quantize but with the value/storage roles swapped
# (input is the INTEGER storage, output the FLOAT value; scale.element == output's, zero_point.element == input's).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "dequantize"
summary = "Integer-storage -> float dequantization: output = (input - zero_point) * scale (per-tensor rank-0 or per-axis rank-1 scale/zero_point)."
version = 1
operands = [
    { name = "input", type = "tensor", doc = "the INTEGER-storage values to dequantize (a 3d Tensor); its element is the storage int type." },
    { name = "scale", type = "tensor", doc = "the FLOAT scale; RANK-0 (per-tensor) or RANK-1 (per-axis over `axis`); its element == the output's (value/float) element." },
    { name = "zero_point", type = "tensor", doc = "the INTEGER zero-point; same shape as `scale`; its element == input's (storage) element." },
]
results = [
    { name = "output", type = "tensor", doc = "the FLOAT result; element = the expressed/value float type (rides the result); shape == input's." },
]
attributes = [
    { name = "axis", kind = "int", required = true, doc = "the per-axis axis (>=0, < input rank); meaningful iff scale is RANK-1. find_quant_misuse: with a rank-1 scale, axis in [0,rank) and scale.dim0 == input.dim[axis]." },
    { name = "scheme", kind = "string", required = true, doc = "the scheme, a CLOSED vocab: symmetric | asymmetric. find_quant_misuse rejects any other token (SchemeInvalid)." },
]
traits = ["Pure"]
docs = "quant.dequantize(%input, %scale, %zero_point) {axis, scheme} -> %output. Integer-storage -> float dequantization (sec-54); the mirror of quantize (output = (input - zero_point)*scale). ⛔ the EXPRESSED float element rides the result; scale/zero_point are OPERANDS (rank-0/rank-1). Pure, NO kernel_ref (the dequant->gemm FUSION is a 23b provider window, NOT a hook here). find_quant_misuse: input,scale,zero_point operands + output result Tensor-kinded (OperandNotTensor / ResultNotTensor); output.shape == input.shape (ShapeMismatch); scale.shape == zero_point.shape (ScaleZeroPointMismatch); scale rank 0 or 1 (ScaleRankInvalid); a rank-1 scale => `axis` in [0, input rank) and scale.dim0 == input.dim[axis] (AxisScaleMismatch); scale.element == output.element (the value/float side, ScaleElementMismatch); zero_point.element == input.element (the storage/int side, ZeroPointElementMismatch); `scheme` in {symmetric,asymmetric} (SchemeInvalid). ⛔ the INTEGER-input + FLOAT-output + Q8-specific restriction rides the 23b provider (name-forward). STRUCTURAL (3 operands, 1 result, `axis` present+Int, `scheme` present+String): the generated verify_dequantize."
