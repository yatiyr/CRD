schema_version = 1
dialect = "rt"
summary = "CEIR-19 sec-49 ceir.rt: production-grade RAY-TRACING ORCHESTRATION as authored CEIR. The host RT surface (vulkan_ray_tracing_context: build a BLAS from a triangle-soup / procedural-AABB / cluster geometry, populate INSTANCES with row-major 3x4 transforms, build a TLAS over them, set up a raygen/miss/closest-hit pipeline, and TRACE — or run an INLINE ray_query compute kernel against the TLAS) gets its declared CEIR IDENTITY: a SIX-op vocabulary of NATIVE INTRINSICS (ADR-0110 [op.native] provider=host — the replaceable-capability tier: a user MAY write a different RT orchestration, e.g. the sec-134 WAVEFRONT PATH TRACER, as a CEIR PROGRAM built from these ops) that the crd-ceir-gpu BRIDGE lowers onto vulkan_ray_tracing_context at a LATER slice (19b+; crd-ceir core NEVER links gpu-context — I3/I4). This slice (19a) is DECLARE-only: types + ops + verifier + tests, ZERO renderer changes. ⛔ CURRENCY RULE (the band spine, the 17a house pattern): the dialect declares the ENGINE's surface (NAMING/SEMANTICS — the engine is the witness a step is REAL), while sec-49 governs DECOMPOSITION (the vocabulary future lowerings CITE, not a transcript of today's convenience wrappers — the engine's fused `build_scene_as` is ONE host lowering of blas_build->instance_populate->tlas_build, each op's docs NAMES that mapping). ⛔ 3 Extern TYPE-CLASSES (8a; the ROLE rides the TYPE, so find_rt_misuse verifies the CHAIN): rt.blas / rt.tlas / rt.sbt — DISTINCT TypeIds, because `trace` consumes a %tlas + a %sbt while `ray_query` consumes a %tlas ONLY (the inline-vs-pipeline distinction is checkable only if tlas != sbt). The engine's fused RtScene is the host value that backs %blas + %tlas (the 17b u64-SceneResolveHandle precedent — an opaque handle shared by the lowering is normal; the TYPES stay distinct). ⛔ NOT Pure: AS builds WRITE device memory (GPUCommand + a conservative ambient MemoryReadWrite, the compute.dispatch baseline — an AS build touches its scratch + dest, so it MUST hazard against exports/transfers) and trace/ray_query run USER SHADER GROUPS (raygen/chit do arbitrary buffer writes — the same device-execute effect compute.dispatch carries, NOT a resolve-style read effect); determinism is ExternalNondeterminism (AS layout/build timings are externally nondeterministic, deterministic given host state that changes externally). Well-formedness rides the module-walk verifier Context::find_rt_misuse (the find_dispatch_misuse / find_scene_misuse house pattern): each op's operands are the RIGHT rt type-class or resource-kinded, closed-vocab attrs enforced, ⛔ I6 — find_rt_misuse switches on TypeId/traits, NEVER op.kind. ⛔ NO-FOLLOW / CAPABILITY-ATTR tier (declared != implemented, the open-world contract — DECLARED here so a program can carry them + a future backend witness them, but NO engine lowering yet): BLAS refit/update + BLAS COMPACTION (the engine builds but does not refit/compact) + MOTION blur AS + OPACITY MICROMAPS (OMM) + DISPLACEMENT micromaps + SER/thread-reordering (baked into the raygen SPIR-V today, no op flag) + AS residency/serialization + callable groups + separate intersection shaders — each a DECLARED attr on the op it modifies, never a silent subset. A device HYBRID-RT proof (sec-133 raster->RT shadows->composite) = CEIR-19b (assembled via the EXISTING raytrace.pipeline frame.pass — that path is already authored-CEIR: a frame.pass op + a cook_stage_named .crdv shader loader + a registered executor; NOT this ceir.rt dialect). The crd-ceir-gpu BRIDGE that lowers THIS dialect (rt.trace/ray_query/blas_build/tlas_build) onto vulkan_ray_tracing_context + the wavefront path tracer (sec-134) that consumes it = CEIR-19c (the wavefront's queue/indirect orchestration is the bridge's true first consumer, so it shapes the seam)."

# ----------------------------------------------------------------------------------------------------------------------
# rt.blas_build -- build a BOTTOM-level acceleration structure from geometry. Operand: a %geometry resource (the packed
# vertex/triangle buffer, or the procedural-AABB buffer, or a cluster buffer -- KIND selected by `geometry_kind`). Result:
# a %blas (rt.blas Extern). Lowers to vulkan_ray_tracing_context's BLAS build (build_scene_as's triangle-soup /
# build_hair_scene's procedural-AABB / the CLAS cluster BLAS). ⛔ allow_update / allow_compaction are DECLARED capability
# attrs -- the engine builds but does not refit/compact (declared != implemented). Effects: GPUCommand + MemoryReadWrite
# (writes the AS + reads the geometry). ExternalNondeterminism (AS layout is not bit-reproducible).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "blas_build"
summary = "Build a bottom-level acceleration structure (BLAS) from geometry; produces an rt.blas handle."
version = 1
operands = [
    { name = "geometry", type = "resource", doc = "the geometry buffer: packed triangle vertices (geometry_kind=triangles), procedural AABBs (procedural), or a cluster buffer (cluster). A Buffer or a resource.view of one; read GPU-side by the AS build." },
]
results = [
    { name = "blas", type = "blas", doc = "the built bottom-level AS (an 8a Extern of the rt.blas class); feeds rt.instance_populate. Opaque -- the host lowering backs it with a VkAccelerationStructureKHR (part of the fused RtScene)." },
]
attributes = [
    { name = "geometry_kind", kind = "string", required = false, doc = "the BLAS geometry kind: triangles | procedural | cluster (absent = triangles). CLOSED vocabulary, find_rt_misuse enforces it. `triangles` = a triangle soup (build_scene_as); `procedural` = AABBs + an intersection shader (build_hair_scene's LSS strands); `cluster` = a CLAS/cluster BLAS (NV_cluster_acceleration_structure, with a transparent standard-BLAS fallback)." },
    { name = "allow_update", kind = "bool", required = false, doc = "CAPABILITY-ATTR (declared != implemented): request an UPDATABLE (refittable) BLAS (absent = false). The refit OP (rt.blas_refit) is named-forward; the engine builds but does not refit yet, so this is a declared capability a future backend witnesses." },
    { name = "allow_compaction", kind = "bool", required = false, doc = "CAPABILITY-ATTR (declared != implemented): request a COMPACTABLE BLAS (absent = false). BLAS compaction is named-forward; declared here so a program may carry the intent." },
    { name = "motion", kind = "bool", required = false, doc = "CAPABILITY-ATTR (declared != implemented): a MOTION-blur BLAS (absent = false). Named-forward; no backend witness yet." },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = false }
docs = "rt.blas_build(%geometry) {geometry_kind, allow_update?, allow_compaction?, motion?} -> %blas. Build a BLAS from geometry (a host-orchestrated device capability, ADR-0110 provider=host). Effects: GPUCommand + a conservative ambient MemoryReadWrite (writes the AS, reads the geometry). ExternalNondeterminism (AS layout). LOWERING (19b+): vulkan_ray_tracing_context's BLAS build (build_scene_as triangle-soup / build_hair_scene procedural-AABB / the CLAS cluster build). find_rt_misuse: geometry_kind in {triangles,procedural,cluster} (GeometryKindInvalid). STRUCTURAL (1 operand, 1 result): the generated verify_blas_build. The %geometry operand-resource-kind refinement lands with the 19b bridge lowering. allow_update/allow_compaction/motion = DECLARED capability attrs (no engine witness yet — declared != implemented)."

# ----------------------------------------------------------------------------------------------------------------------
# rt.instance_populate -- populate the INSTANCE descriptors for a BLAS (a BLAS reference + a row-major 3x4 world transform
# per instance) into an instance buffer the TLAS build consumes. Operands: a %blas (rt.blas -- the geometry every instance
# references) + a %transforms resource (the per-instance 3x4 transforms, read GPU-side). Result: a %instances resource (the
# populated instance-descriptor buffer). Lowers to the instance-population half of build_scene_as (ninst instances, each a
# row-major 3x4). The ROLE is typed: operand(0) MUST be rt.blas (find_rt_misuse) -- an instance of nothing is meaningless.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "instance_populate"
summary = "Populate the TLAS instance descriptors (a BLAS ref + a 3x4 transform per instance) into an instance buffer."
version = 1
operands = [
    { name = "blas", type = "blas", doc = "the bottom-level AS every instance references (an rt.blas from rt.blas_build); its device address is written into each instance descriptor" },
    { name = "transforms", type = "resource", doc = "the per-instance transform data: `instance_count` row-major 3x4 world matrices (a Buffer/View; read GPU-side). One BLAS, N transforms = N instances." },
]
results = [
    { name = "instances", type = "resource", doc = "the populated instance-descriptor buffer (a resource); consumed by rt.tlas_build. Each descriptor = the %blas device address + a 3x4 transform + flags." },
]
attributes = [
    { name = "instance_count", kind = "int", required = true, doc = "the number of instances to populate (>=1). find_rt_misuse: >=1 (InstanceCountInvalid). A compile-time count (the transforms buffer holds this many 3x4 matrices)." },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = false }
docs = "rt.instance_populate(%blas, %transforms) {instance_count} -> %instances. Populate `instance_count` instance descriptors (each = %blas's device address + a row-major 3x4 transform) into an instance buffer (a host-orchestrated device capability). Effects: GPUCommand + MemoryReadWrite (writes the instance buffer, reads %blas address + %transforms). LOWERING (19b+): the instance-population half of vulkan_ray_tracing_context.build_scene_as (ninst instances). find_rt_misuse: operand(0) is rt.blas-typed (BlasTypeMismatch); instance_count >= 1 (InstanceCountInvalid). STRUCTURAL (2 operands, 1 result, `instance_count` present+Int): the generated verify_instance_populate. The %transforms operand-resource-kind refinement lands with the 19b bridge lowering."

# ----------------------------------------------------------------------------------------------------------------------
# rt.tlas_build -- build the TOP-level acceleration structure over a populated instance buffer. Operand: a %instances
# resource (from rt.instance_populate). Result: a %tlas (rt.tlas Extern -- what `trace` and `ray_query` traverse). Lowers to
# the TLAS build half of build_scene_as (over the ninst instances). ⛔ allow_update = a DECLARED capability attr (the engine
# rebuilds the TLAS; refit is named-forward). Effects: GPUCommand + MemoryReadWrite. ExternalNondeterminism.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "tlas_build"
summary = "Build the top-level acceleration structure (TLAS) over a populated instance buffer; produces an rt.tlas handle."
version = 1
operands = [
    { name = "instances", type = "resource", doc = "the populated instance-descriptor buffer (from rt.instance_populate); read GPU-side by the TLAS build" },
]
results = [
    { name = "tlas", type = "tlas", doc = "the built top-level AS (an 8a Extern of the rt.tlas class); the scene rt.trace / rt.ray_query traverse. Opaque -- the host lowering backs it with the RtScene's TLAS (vulkan_scene_tlas)." },
]
attributes = [
    { name = "allow_update", kind = "bool", required = false, doc = "CAPABILITY-ATTR (declared != implemented): request an UPDATABLE TLAS (absent = false). TLAS refit is named-forward; the engine rebuilds. Declared so a program may carry the intent." },
    { name = "motion", kind = "bool", required = false, doc = "CAPABILITY-ATTR (declared != implemented): a MOTION-blur TLAS (absent = false). Named-forward; no backend witness." },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = false }
docs = "rt.tlas_build(%instances) {allow_update?, motion?} -> %tlas. Build a TLAS over the populated instance buffer (a host-orchestrated device capability). Effects: GPUCommand + MemoryReadWrite. ExternalNondeterminism. LOWERING (19b+): the TLAS build half of vulkan_ray_tracing_context.build_scene_as. STRUCTURAL (1 operand, 1 result): the generated verify_tlas_build. The %instances operand-resource-kind refinement lands with the 19b bridge lowering. allow_update/motion = DECLARED capability attrs (no engine witness yet)."

# ----------------------------------------------------------------------------------------------------------------------
# rt.sbt_build -- construct the SHADER BINDING TABLE: the raygen / miss / closest-hit (+ future callable/intersection) group
# bindings a `trace` invokes. Produces a %sbt (rt.sbt Extern). ⛔ HONEST LOWERING: the engine has NO standalone SBT object --
# raygen/miss/chit SPIR-V go straight into trace_rays_pipeline, which builds the group table internally. So sbt_build is the
# GROUP-BINDING step the host FOLDS into pipeline setup; the %sbt is the CEIR value that names the group set (the 17b fused-
# handle precedent -- the pipeline's SBT is realized inside trace_rays_pipeline). The shader group identities ride kernel_ref-
# style symbol attrs (raygen/miss/closest_hit @kernel). Effect-metadata-adjacent but carries GPUCommand because the pipeline/
# SBT build touches device memory. ExternalNondeterminism.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "sbt_build"
summary = "Construct the shader binding table (raygen/miss/closest-hit group bindings) a trace invokes; produces an rt.sbt handle."
version = 1
operands = []
results = [
    { name = "sbt", type = "sbt", doc = "the shader binding table (an 8a Extern of the rt.sbt class); consumed by rt.trace alongside a %tlas. Names the raygen/miss/hit group set. The host lowering FOLDS this into trace_rays_pipeline (no standalone SBT object)." },
]
attributes = [
    { name = "raygen", kind = "symbol", required = true, doc = "the RAYGEN shader group identity (@kernel; the .crdv RT raygen, e.g. scene_rt_raygen). ⛔ identity is LOAD-BEARING: absent/non-symbol is rejected by the generated verify_sbt_build (required SymbolRef)." },
    { name = "miss", kind = "symbol", required = false, doc = "the MISS shader group identity (@kernel, e.g. scene_rt_miss); absent = the pipeline's default/no miss." },
    { name = "closest_hit", kind = "symbol", required = false, doc = "the CLOSEST-HIT shader group identity (@kernel, e.g. scene_rt_closest_hit); absent = no chit group." },
    { name = "any_hit", kind = "symbol", required = false, doc = "the ANY-HIT shader group identity (@kernel, e.g. scene_rt_any_hit); absent = opaque geometry (the anyhit-OPAQUE scar — an any-hit implies non-opaque). Named-forward for the callable/intersection groups." },
    { name = "reorder", kind = "bool", required = false, doc = "CAPABILITY-ATTR (declared != implemented as a flag): SER / thread-reordering (absent = false). Today SER is baked into the raygen SPIR-V (hitObjectNV/reorderThreadNV), no op flag — declared here as the CEIR-level intent a future lowering may honor." },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = false }
docs = "rt.sbt_build() {raygen=@rg, miss?=@ms, closest_hit?=@ch, any_hit?=@ah, reorder?} -> %sbt. Construct the SBT (the raygen/miss/hit group set) a trace invokes (a host-orchestrated device capability). ⛔ HONEST LOWERING: the engine has no standalone SBT — the host FOLDS this into trace_rays_pipeline (which builds the group table from the raygen/miss/chit SPIR-V); the %sbt is the CEIR value that names the group set (the 17b fused-handle precedent). Effects: GPUCommand + MemoryReadWrite (the pipeline/SBT build). STRUCTURAL (0 operands, 1 result, `raygen` present+SymbolRef; miss/closest_hit/any_hit, if present, SymbolRef): the generated verify_sbt_build. reorder = a DECLARED capability attr. ⛔ LOWERING DEFERRED to 19z (folds into rt.trace, which is not yet lowered; CEIR-19c ships ray_query + AS-builds only)."

# ----------------------------------------------------------------------------------------------------------------------
# rt.trace -- a RAY-TRACING PIPELINE trace: dispatch the raygen shader over a (width, height, depth) launch grid against a
# %tlas with a %sbt (the raygen/miss/hit groups) + the bound resources. RESULTLESS -- a device-execute op (compute.dispatch's
# sibling: it runs USER SHADER GROUPS that do arbitrary buffer writes). Lowering target = vulkan_ray_tracing_context.trace_rays_pipeline
# — ⛔ DEFERRED to 19z (declared, NOT yet lowered; CEIR-19c ships ray_query + AS-builds only).
# ⛔ operand order: dims (0..2), tlas (3), sbt (4), then the variadic bindings. Effects: GPUCommand + ambient MemoryReadWrite.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "trace"
summary = "A ray-tracing pipeline trace: dispatch raygen over a (width,height,depth) grid against a %tlas with a %sbt + bindings (device-execute, like compute.dispatch)."
version = 1
operands = [
    { name = "width", type = "index", doc = "the raygen launch width (a runtime index; a compile-time size is an arith.const operand — the compute.dispatch grid shape)" },
    { name = "height", type = "index", doc = "the raygen launch height (a runtime index)" },
    { name = "depth", type = "index", doc = "the raygen launch depth (a runtime index; callers pass arith.const 1 for a 2D launch)" },
    { name = "tlas", type = "tlas", doc = "the top-level AS to traverse (an rt.tlas from rt.tlas_build); bound as the ray-query/pipeline TLAS" },
    { name = "sbt", type = "sbt", doc = "the shader binding table (an rt.sbt from rt.sbt_build) — the raygen/miss/hit group set. ⛔ trace consumes a %sbt (rt.trace = the PIPELINE path); rt.ray_query does NOT (the inline path) — the distinction the distinct TypeIds make checkable." },
    { name = "bindings", type = "resource", variadic = true, doc = "the RT shaders' bound resources (the output image, scene buffers, ...), in SLOT order; each binding's ACCESS is the matching `access` token, KIND from its CEIR-3c type" },
]
attributes = [
    { name = "access", kind = "string", required = true, doc = "per-binding access over the variadic bindings tail: comma-separated {r|w|rw}, one token per binding (empty string = zero bindings). find_rt_misuse checks token-count == num bindings and each token in {r,w,rw}." },
    { name = "max_recursion", kind = "int", required = false, doc = "sec-49 the max ray recursion depth (absent = 1). A static pipeline attr (the trace_rays_pipeline recursion bound). find_rt_misuse: >=1 if present." },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = false }
docs = "rt.trace(%width, %height, %depth, %tlas, %sbt, %bindings...) {access=\"...\", max_recursion?}. A ray-tracing pipeline trace (compute.dispatch's sibling — it runs USER shader groups, RESULTLESS). Effects: GPUCommand + a conservative ambient MemoryReadWrite (the raygen/chit do arbitrary bound-buffer writes). LOWERING TARGET: vulkan_ray_tracing_context.trace_rays_pipeline (the raygen/miss/chit SPIR-V from the %sbt, the TLAS at binding 0) — ⛔ DEFERRED to 19z (declared, NOT yet lowered; CEIR-19c ships ray_query + AS-builds only, the inline path). find_rt_misuse (the find_dispatch_misuse mirror, contractual order): operand(3) rt.tlas-typed (TlasTypeMismatch); operand(4) rt.sbt-typed (SbtTypeMismatch); dims (operands 0-2) Index-typed (DimNotIndex); each `access` token in {r,w,rw} (AccessTokenInvalid) with token-count == num bindings (== num_operands-5, AccessArityMismatch); each binding (operands 5..) resource-kinded (BindingNotResource); max_recursion >= 1 if present (MaxRecursionInvalid). STRUCTURAL (>=5 operands, 0 results, `access` present+String): the generated verify_trace."

# ----------------------------------------------------------------------------------------------------------------------
# rt.ray_query -- an INLINE ray-query dispatch: launch @kernel (a compute kernel that does inline rayQuery, ckir_rt.hpp) over
# a (gx, gy, gz) workgroup grid against a %tlas with the bound resources. ⛔ NEARLY IDENTICAL to compute.dispatch + a %tlas
# operand -- the inline-RT MATH lives in the CKIR kernel (ckir_rt.hpp's rayQuery); this op is the DISPATCH of such a kernel
# with a TLAS bound. It consumes a %tlas ONLY (NO %sbt -- the inline path has no shader binding table; that distinction from
# rt.trace is the whole point of the distinct type-classes). Lowers to dispatch_inline_ray_query. ⛔ grid (0..2), tlas (3),
# then bindings. Effects: GPUCommand + ambient MemoryReadWrite (compute.dispatch's effect). kernel_ref for @kernel.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "ray_query"
summary = "An inline ray-query dispatch: launch @kernel (inline rayQuery) over a (gx,gy,gz) grid against a %tlas with bindings (≈ compute.dispatch + a tlas, no SBT)."
version = 1
operands = [
    { name = "grid_x", type = "index", doc = "workgroup count in X (a runtime index — the compute.dispatch grid shape)" },
    { name = "grid_y", type = "index", doc = "workgroup count in Y" },
    { name = "grid_z", type = "index", doc = "workgroup count in Z" },
    { name = "tlas", type = "tlas", doc = "the top-level AS the kernel's inline rayQuery traverses (an rt.tlas from rt.tlas_build); bound at the inline-RT TLAS slot. ⛔ rt.ray_query consumes a %tlas ONLY — NO %sbt (the inline path has no SBT; the distinction from rt.trace)." },
    { name = "bindings", type = "resource", variadic = true, doc = "the kernel's bound resources, in SLOT order (as compute.dispatch); each binding's ACCESS is the matching `access` token, KIND from its type" },
]
attributes = [
    { name = "kernel", kind = "symbol", required = true, doc = "the inline-ray-query compute kernel identity (@kernel; a CKIR kernel using ckir_rt.hpp rayQuery). CEIR-13c: extracted as a ckir_ref + resolved/pin-checked. ⛔ absent/non-symbol is rejected by the generated verify_ray_query (required SymbolRef)." },
    { name = "access", kind = "string", required = true, doc = "per-binding access over the variadic bindings tail: comma-separated {r|w|rw}, one token per binding (empty = zero bindings)." },
    { name = "kernel_interface", kind = "int", required = false, doc = "CEIR-13c the EXPECTED §107 interface hash of @kernel (a PIN, the u64 as its i64 bit pattern; absent = unpinned). Checked vs the resolved kernel at cook." },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
kernel_ref = { symbol = "kernel", interface = "kernel_interface" }
native = { provider = "host", determinism = "ExternalNondeterminism", hot_reload_safe = false }
docs = "rt.ray_query(%gx, %gy, %gz, %tlas, %bindings...) {kernel=@k, access=\"...\", kernel_interface?}. An inline ray-query dispatch, RESULTLESS. ⛔ ≈ compute.dispatch + a %tlas operand — the inline-RT rayQuery MATH is CKIR-level (ckir_rt.hpp); this CEIR op is the DISPATCH of such a kernel with the TLAS bound. Consumes a %tlas ONLY (no %sbt — the inline path). Effects: GPUCommand + ambient MemoryReadWrite (compute.dispatch's effect). CEIR-13c [op.kernel_ref] {kernel, kernel_interface}. LOWERING (19b+): vulkan_ray_tracing_context.dispatch_inline_ray_query (the TLAS at binding 0). find_rt_misuse (the find_dispatch_misuse mirror, contractual order): operand(3) rt.tlas-typed (TlasTypeMismatch); grid (operands 0-2) Index-typed (DimNotIndex); each `access` token in {r,w,rw} (AccessTokenInvalid) with token-count == num bindings (== num_operands-4, AccessArityMismatch); each binding (operands 4..) resource-kinded (BindingNotResource). STRUCTURAL (>=4 operands, 0 results, `kernel` present+SymbolRef, `access` present+String): the generated verify_ray_query."
