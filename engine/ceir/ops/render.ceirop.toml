# emit ONE raster packet whose verb is chosen PER ITEM from the item's fields -- args!=null && index_count>0 ->
# DrawIndexedIndirect; index_count>0 && textured -> DrawIndexed; combined/textured -> Draw StoragePull; plain -> COALESCE a
# consecutive run into DrawMulti / DrawMultiIndexed -- all inside ONE render.scope. ZERO operands: ALL per-item data
# (program/storage/texture/args/counts) is HOST DrawList data resolved at record (the op is the scene TEMPLATE;
# execute_render_lowered's walk expands it over the DrawList). The pass-level sampled atlas (shadow/moment) + its sampler
# shape resolve via the pass-texture resolver. record_scene_raster's single-colour arm (the mrt>=2 G-buffer arm is a
# SEPARATE representation, brought back as its own sub-slice). §8a shape (i): materialize packets per-draw at record.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "scene_draw_list"
summary = "The scene per-draw-item verb ladder: ONE render.scope, N packets over the host DrawList; each item's fields (args/index_count/texture/storage) select its verb (indirect/indexed/storage-pull/coalesced-multi)."
version = 1
operands = []
attributes = [
    { name = "program", kind = "symbol", required = true, doc = "the scene @program PLACEHOLDER (the pass's raster program resolves at record; a per-item program beats it)" },
    { name = "access", kind = "string", required = true, doc = "per-binding access; ZERO bindings here (arity 0)" },
    { name = "program_interface", kind = "int", required = false, doc = "CEIR-13c the EXPECTED §107 interface hash (a PIN; absent = unpinned)" },
]
effects = [ "GPUCommand", "MemoryReadWrite" ]
kernel_ref = { symbol = "program", interface = "program_interface" }
docs = "render.scene_draw_list() {program=@p, access=\"\"}. The scene per-draw-item verb ladder (record_scene_raster single-colour arm): ONE render.scope, the walk expands it over the host DrawList (ctx.draws()) into N raster packets whose verb is chosen PER ITEM (DrawIndexedIndirect | DrawIndexed | Draw StoragePull | DrawMulti/DrawMultiIndexed run-coalesced), RESULTLESS, legal ONLY inside a render.scope. Effects: GPUCommand + ambient MemoryReadWrite. find_render_misuse: ZERO operands (access arity 0); program a Symbol."
