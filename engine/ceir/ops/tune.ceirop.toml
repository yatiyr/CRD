schema_version = 1
dialect = "tune"
summary = "CEIR-28 sec-80/81/82 the tune dialect: the TARGET-SPECIFIC CONFIGURATION CACHE as an AUTHORABLE asset (the roadmap's 'target-specific configuration cache' proof + the sec-80 'deterministic locked configuration mode'). A tune module is a SEPARATE asset (NOT a payload): each tune.entry is one CACHE ROW mapping a device+env+program+shape KEY to a chosen SCHEDULE, exactly the shape of the v17 autotuner's checked-in ckir_tuning_db.inc ({op, DEVICE, ENV, M,N,K, sched}) but PORTABLE (a .ceir asset, not a .inc; device is a backend+adapter string, not a CUDA arch) -- v17 is the REFERENCE (the floor); CEIR-28 re-instantiates its offline-tune -> checked-in-DB -> runtime-replay pipeline over the CEIR schedule space. The loader (plan_options_from_tune_cache, tensor_pipeline) reads the row for THIS device; a HIT yields the row's PlanOptions, a MISS falls back to the default schedule and does NOT measure (sec-81 deterministic fallback / sec-80 locked mode). This slice's schedule is the CEIR-27 PlanOptions {fuse_gemm_relu, share_intermediate_storage} INLINED as two bool attrs (the 4-config space 27b proved BIT-EXACT across backends -- the oracle gate is free); a schedule-REF to a named ceir.transform asset (for schedules too large to inline) is named-forward. Driver/compiler-version finer keying (sec-80 lists them) rides `env` for now (v17 bundled OS as ENV); split out when a consumer needs it. A tune.entry carries NO results/operands and NO effects and is NOT Pure -- a cache row is config metadata, not a value computation, so Pure/CSE/DCE reasoning does not apply. ⛔ the module-wide 'at most one row per KEY' contract is find_tune_misuse's (DuplicateKey), NOT the generated verifier's (which owns the per-row required-attr contract) -- the transform/rewrite house pattern."

# ----------------------------------------------------------------------------------------------------------------------
# tune.entry -- one cache row: the KEY (device, env, program_hash, shape) -> the chosen SCHEDULE (fuse, share). device is a
# backend+adapter string (e.g. "vk:rtx4070ti", not a CUDA arch); env bundles OS/driver (v17's ENV); program_hash identifies the
# payload program; shape is the shape/workload class. fuse/share ARE the CEIR-27 PlanOptions inlined. The loader matches all four
# KEY attrs; find_tune_misuse rejects a duplicated KEY (DuplicateKey). NO results/operands/effects + NOT Pure: cache metadata.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "entry"
summary = "One cache row: KEY (device, env, program_hash, shape) -> the chosen schedule (fuse, share) = CEIR-27 PlanOptions."
version = 1
attributes = [
    { name = "device", kind = "string", required = true, doc = "the target device KEY -- a backend+adapter string (e.g. \"vk:rtx4070ti\", \"dx12:...\", \"vk:llvmpipe\"), NOT a CUDA arch. The loader matches device_key against this." },
    { name = "env", kind = "string", required = true, doc = "the environment KEY -- OS + driver bundle (v17's ENV, e.g. \"win32\"). Driver/compiler-version finer keying (sec-80) rides here for now; split out when a consumer needs it." },
    { name = "program_hash", kind = "int", required = true, doc = "the program identity KEY -- a hash of the payload program (which computation this row tunes). The measurer (28b) emits the real hash; the loader matches it." },
    { name = "shape", kind = "string", required = true, doc = "the shape/workload-class KEY -- e.g. a canonical dims string. A program tuned for one shape class need not win for another (sec-80 shape/workload class)." },
    { name = "fuse", kind = "bool", required = true, doc = "the chosen schedule: PlanOptions.fuse_gemm_relu (the CEIR-27 transform.fuse directive, inlined)." },
    { name = "share", kind = "bool", required = true, doc = "the chosen schedule: PlanOptions.share_intermediate_storage (the CEIR-27 transform.share_storage directive, inlined)." },
]
traits = []
docs = "One target-specific configuration-cache row: the KEY (device, env, program_hash, shape) -> the chosen schedule (fuse, share = the CEIR-27 PlanOptions). The loader plan_options_from_tune_cache matches all four KEY attrs for THIS device; a HIT yields PlanOptions{fuse, share}, a MISS falls back to the default (sec-80 locked mode / sec-81 deterministic fallback). find_tune_misuse rejects a duplicated KEY (DuplicateKey); the generated verifier owns the per-row required-attr contract. NO results/operands/effects and NOT Pure -- cache metadata, not a value computation. This mirrors the v17 ckir_tuning_db.inc row shape ({op, DEVICE, ENV, M,N,K, sched}) but PORTABLE (a .ceir asset). A schedule-REF to a named ceir.transform asset (for schedules too large to inline as fuse/share) is named-forward."
