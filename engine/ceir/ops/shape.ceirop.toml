schema_version = 1
dialect = "shape"
summary = "CEIR-21 sec-35 ceir.shape: OWN symbolic + dynamic SHAPE reasoning as authored CEIR — the value-op dialect over the CEIR-3d shape TYPES (Dim/Shape, already declared TypeKinds; §21/§35). A high-level shape vocabulary a tensor program (ceir.tensor, 21b) + a provider partitioner CITE, so shape rules live in the IR — NEVER 'encoded only as ad-hoc runtime checks inside kernels' (§21). ⛔ DECLARE-only (21a): types already exist (3d), this slice adds the OPS + the module-walk verifier Context::find_shape_misuse + tests, ZERO renderer changes, crd-ceir NEVER links gpu-context (I3/I4). ⛔ ALL PURE + typed NoSemantics (value constructors/queries over shapes; no memory/device effect) — the 12a resource.declare precedent, NOT the 20a native-intrinsic tier. ⛔ NO kernel_ref, NO lowering hook on any op (§70: a NATIVE graph backend must ingest the tensor+shape graph WHOLE — never flatten a shape query to a dispatch). ⛔ CURRENCY: the ops WRAP the 3d tri-state predicates (`shapes_broadcast`→BroadcastResult, `shapes_reshape`→ShapeCompat); the VERIFIER contract is Incompatible → a POINTING misuse (the 3z BroadcastResult.position), Unknown → ACCEPT (the principled deferral 3d named — a `shape.assert` DISCHARGES it at runtime), Compatible → accept. ⛔ I6 — find_shape_misuse switches on TypeId/TypeKind, NEVER op.kind. ⛔ NO-FOLLOW / DEFERRED (declared != implemented — a later slice with a real consumer, never a silent subset): symbolic-dim EXPRESSIONS (add/mul/floordiv over Symbolic dims — §35 'symbolic expressions'; the arith-over-Dim algebra) land when a specializing consumer needs them; specialization-from-observed-shapes (§21) is a provider/JIT concern (CEIR-24+); layout constraints (§22) are CEIR-21c; the sparse-format encoding is CEIR-23 (struck from 3d @ band-open). ⛔ `shape.assert` is a runtime GUARD — for THIS declare-only slice it carries typed NoSemantics + is modeled Pure (no effect family fits a control guard; §26 stops at Debug); the CANONICALIZER-must-not-fold-it-to-identity contract is NAMED-FORWARD to CEIR-6 canonicalization (no DCE/fold pass targets ceir.shape today, so the concern is theoretical until a consumer runs one)."

# ----------------------------------------------------------------------------------------------------------------------
# shape.make -- CONSTRUCT a Shape value from ordered Dim operands (§35 'shape values'). Variadic (0 dims = the rank-0
# `!shape<>` scalar-shape from 3d). Pure value constructor. find_shape_misuse: each operand Dim-typed (MakeOperandNotDim),
# result Shape-typed (ResultNotShape).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "make"
summary = "Construct a Shape from ordered Dim operands (0 dims = the rank-0 !shape<> scalar-shape); a Pure value constructor."
version = 1
operands = [
    { name = "dims", type = "dim", variadic = true, doc = "the shape's dimensions in axis order (each a 3d Dim value -- Static/Symbolic/Dynamic); 0 operands = a rank-0 shape (!shape<>)." },
]
results = [
    { name = "shape", type = "shape", doc = "the constructed Shape value (a 3d Shape TypeKind whose members are the operand dims, in order)." },
]
attributes = []
traits = ["Pure"]
docs = "shape.make(%dims...) -> %shape. Construct a Shape value from ordered Dim operands (§35 shape values); RANK = operand count (0 = the rank-0 !shape<>). Pure (a value constructor, no effect). find_shape_misuse: every operand Dim-typed (MakeOperandNotDim, pointing the first offender), result Shape-typed (ResultNotShape). STRUCTURAL (0+ operands, 1 result, no attrs): the generated verify_make."

# ----------------------------------------------------------------------------------------------------------------------
# shape.rank -- the RANK (dimension count) of a Shape, as an Index (§35 'rank'). Pure. find_shape_misuse: operand
# Shape-typed (OperandNotShape), result Index-typed (RankResultNotIndex).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "rank"
summary = "The RANK (dimension count) of a Shape, as an Index."
version = 1
operands = [
    { name = "shape", type = "shape", doc = "the Shape whose rank is queried (a 3d Shape TypeKind)." },
]
results = [
    { name = "rank", type = "index", doc = "the rank = the Shape's dimension count, as an Index." },
]
attributes = []
traits = ["Pure"]
docs = "shape.rank(%shape) -> %rank. The rank (dimension count) of a Shape (§35 rank), as an Index. Pure. find_shape_misuse: operand Shape-typed (OperandNotShape), result Index-typed (RankResultNotIndex). STRUCTURAL (1 operand, 1 result, no attrs): the generated verify_rank."

# ----------------------------------------------------------------------------------------------------------------------
# shape.extent -- the EXTENT Dim at `axis` of a Shape (§35 'extents'). Pure. `axis` is a required Int (>=0). find_shape_misuse:
# operand Shape-typed (OperandNotShape), result Dim-typed (ExtentResultNotDim), axis present+Int+>=0 AND (when the Shape's rank
# is STATICALLY known) axis < rank (ExtentAxisInvalid, the declared-words / bounds scar); a dynamic-rank shape defers the bound.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "extent"
summary = "The extent Dim at `axis` of a Shape (axis bounds-checked against a statically-known rank)."
version = 1
operands = [
    { name = "shape", type = "shape", doc = "the Shape whose axis-`axis` extent is queried (a 3d Shape TypeKind)." },
]
results = [
    { name = "dim", type = "dim", doc = "the extent at `axis` = the Shape's member Dim at that axis (Static/Symbolic/Dynamic)." },
]
attributes = [
    { name = "axis", kind = "int", required = true, doc = "the axis index (>=0). find_shape_misuse: present + Int + >=0, AND < rank when the Shape's rank is statically known (ExtentAxisInvalid); a dynamic-rank Shape defers the upper bound to runtime." },
]
traits = ["Pure"]
docs = "shape.extent(%shape) {axis} -> %dim. The extent Dim at `axis` of a Shape (§35 extents). Pure. find_shape_misuse: operand Shape-typed (OperandNotShape), result Dim-typed (ExtentResultNotDim), `axis` present+Int+>=0 and (statically-ranked) axis < rank (ExtentAxisInvalid). STRUCTURAL (1 operand, 1 result, `axis` present+Int): the generated verify_extent."

# ----------------------------------------------------------------------------------------------------------------------
# shape.broadcast -- the numpy-BROADCAST RESULT shape of two Shapes (§35 'broadcast'). WRAPS the 3d `shapes_broadcast`
# predicate: Incompatible -> ShapeBroadcastIncompatible pointing the RIGHT-ALIGNED position (the 3z BroadcastResult.position);
# Unknown -> ACCEPT (symbolic/dynamic dims defer to a shape.assert); Compatible -> accept. ⭐ THE producer 3d lacked ('rejected
# a broadcast-result constructor, no producer until 18') -- 21b elementwise consumes it. Pure.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "broadcast"
summary = "The numpy-broadcast RESULT shape of two Shapes (wraps the 3d shapes_broadcast predicate; Unknown defers to shape.assert)."
version = 1
operands = [
    { name = "lhs", type = "shape", doc = "the left Shape (a 3d Shape TypeKind)." },
    { name = "rhs", type = "shape", doc = "the right Shape (a 3d Shape TypeKind)." },
]
results = [
    { name = "shape", type = "shape", doc = "the broadcast-result Shape (numpy align-right rule). Well-typed when shapes_broadcast(lhs,rhs) is Compatible or Unknown; find_shape_misuse rejects Incompatible." },
]
attributes = []
traits = ["Pure"]
docs = "shape.broadcast(%lhs, %rhs) -> %shape. The numpy-broadcast result shape of two Shapes (§35 broadcast); the producer for 21b elementwise. Pure. find_shape_misuse WRAPS 3d shapes_broadcast: Incompatible -> ShapeBroadcastIncompatible pointing the right-aligned position (BroadcastResult.position, the 3z diag); Unknown -> ACCEPT (the principled deferral -- symbolic/dynamic dims discharge at a shape.assert); Compatible -> accept. operands + result Shape-typed (OperandNotShape / ResultNotShape). ⛔ RESULT EXACTNESS (result == the exact computed broadcast shape) is NAME-FORWARDED to CEIR-21b: it needs a `shapes_broadcast_result(a,b) -> TypeId` helper whose consumer is 21b's `ceir.tensor` elementwise (the producer 3d lacked); 21a enforces compat + result-KIND only (make/extent/reshape DO enforce result-identity here — broadcast is the sole deferral). STRUCTURAL (2 operands, 1 result, no attrs): the generated verify_broadcast."

# ----------------------------------------------------------------------------------------------------------------------
# shape.reshape -- validate a RESHAPE from a source Shape to a target Shape (§35 'reshape compatibility'). WRAPS the 3d
# `shapes_reshape` predicate (static element-count product equality, overflow -> Unknown): Incompatible -> ShapeReshapeIncompatible;
# Unknown -> ACCEPT (dynamic/symbolic total defers to a shape.assert); Compatible -> accept. Result = the target Shape (validated).
# Pure.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "reshape"
summary = "Validate a reshape from a source Shape to a target Shape (wraps the 3d shapes_reshape predicate); result = the validated target."
version = 1
operands = [
    { name = "src", type = "shape", doc = "the SOURCE Shape being reshaped (a 3d Shape TypeKind)." },
    { name = "target", type = "shape", doc = "the TARGET Shape (a 3d Shape TypeKind); element-count-compatible with src (shapes_reshape)." },
]
results = [
    { name = "shape", type = "shape", doc = "the validated target Shape (= the `target` operand's type). Well-typed when shapes_reshape(src,target) is Compatible or Unknown." },
]
attributes = []
traits = ["Pure"]
docs = "shape.reshape(%src, %target) -> %shape. Validate a reshape src -> target (§35 reshape compatibility); result = the validated target Shape. Pure. find_shape_misuse WRAPS 3d shapes_reshape (static element-product equality, u32-overflow -> Unknown): Incompatible -> ShapeReshapeIncompatible; Unknown -> ACCEPT (dynamic/symbolic total discharges at a shape.assert); Compatible -> accept. operands + result Shape-typed (OperandNotShape / ResultNotShape). STRUCTURAL (2 operands, 1 result, no attrs): the generated verify_reshape."

# ----------------------------------------------------------------------------------------------------------------------
# shape.assert -- the RUNTIME SHAPE CHECK (§21 'runtime shape checks' / 'shape assertions'): DISCHARGE the Unknown a static
# predicate deferred. Asserts `relation` holds between two Shapes at runtime; passes %lhs through (a refined shape the program
# then relies on). CLOSED `relation` vocab {equal|broadcast|reshape}. ⛔ Pure for THIS declare-only slice (typed NoSemantics; no
# effect family fits a control guard); the canonicalizer-must-not-fold contract is named-forward (CEIR-6). find_shape_misuse:
# operands Shape-typed, result == %lhs type, `relation` in the closed vocab (AssertRelationInvalid, the closed-enum-the-verifier-names scar).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "assert"
summary = "A runtime shape-relation check (the Unknown discharge): assert `relation` between two Shapes, pass %lhs through."
version = 1
operands = [
    { name = "lhs", type = "shape", doc = "the Shape asserted + passed through (a 3d Shape TypeKind)." },
    { name = "rhs", type = "shape", doc = "the Shape `lhs` is asserted against (a 3d Shape TypeKind)." },
]
results = [
    { name = "shape", type = "shape", doc = "= %lhs, now asserted to satisfy `relation` with %rhs (a refined shape downstream ops rely on)." },
]
attributes = [
    { name = "relation", kind = "string", required = true, doc = "the asserted relation, a CLOSED vocab: equal | broadcast | reshape. find_shape_misuse rejects any other token (AssertRelationInvalid)." },
]
traits = ["Pure"]
docs = "shape.assert(%lhs, %rhs) {relation} -> %shape. The runtime shape check (§21 runtime shape checks / shape assertions) that DISCHARGES a static Unknown: assert `lhs relation rhs` at runtime (else trap), pass %lhs through. `relation` closed vocab {equal|broadcast|reshape}. Pure for declare-only (typed NoSemantics); ⛔ a canonicalizer must NOT fold it to identity (it is a guard) -- named-forward to CEIR-6. find_shape_misuse: operands Shape-typed (OperandNotShape), result == %lhs type (AssertResultMismatch), `relation` present+String+in-vocab (AssertRelationInvalid). STRUCTURAL (2 operands, 1 result, `relation` present+String): the generated verify_assert."
