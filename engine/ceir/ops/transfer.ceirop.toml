schema_version = 1
dialect = "transfer"
summary = "CEIR-13b sec-50 ceir.transfer: complete data-movement semantics -- copy (buffer/image/buffer-image/image-buffer, and SUBRESOURCE copies via VIEW operands -- shipped), clear, mip generation, upload (host->device), readback (device->host). HOST-authorable op vocabulary (ADR-0109): the ops live in crd-ceir; the crd-ceir-gpu BRIDGE lowers them onto the canonical command model / IComputeContext at CEIR-13d (core NEVER links gpu-context -- I3/I4). ⛔ effects are STATIC per-op-kind (a copy ALWAYS reads src / writes dst -- unlike ceir.compute's per-instance ambient baseline: there is no per-instance access here to defer): copy = Write{dst} + Read{src}, upload/clear = Write{dst}, readback = Read{src}, mip_gen = ReadWrite{image}. So a transfer HAZARDS its neighbours PRECISELY (the upload->first-read barrier scar is Write{dst}-then-Read{dst} = RAW, by construction) and -- unlike a dispatch -- does NOT extend an UNRELATED resource's 12c live range (the effect names a specific operand, never the whole Memory class). All ops RESULTLESS (host materialization for readback is provider-side; the sec-129 oracle compares OUTSIDE the IR). Well-formedness rides the module-walk verifier Context::find_transfer_misuse. ⛔ KNOWN HOLE (struck-in-place at 12c, retrofit named-forward): a transfer through a VIEW escapes ops_hazard today (distinct SSA Values assumed non-aliasing); 13b does not widen it but makes it easier to hit -- transfers through views are natural. ⛔ NO-FOLLOW (named, never silently subset): sec-50's tensor copy + blit + resolve + peer copy + sparse page mapping/upload + compression/decompression -> CEIR-13+/26; a TYPED image clear (this slice's `value` is the buffer FILL WORD only) -> CEIR-13d/render (aligns with RAH-1a.1's typed clear: clear_kind Float|Uint + clear_uint)."

# ----------------------------------------------------------------------------------------------------------------------
# transfer.copy -- copy a whole resource (or a SUBRESOURCE, when an operand is a resource.view carrying a range) from src
# to dst. ONE op spans buffer->buffer / image->image / buffer->image / image->buffer -- the kind combo is DERIVED from the
# operand types (the 12a one-op-spans-the-type doctrine). ⛔ OPERAND ORDER IS (dst, src) -- memcpy/D3D12 style, NOT Vulkan's
# (src, dst); the declared effects Write{0}/Read{1} are the machine truth. find_transfer_misuse: both operands transferable
# (Buffer|Image|View-of-those); src != dst by SSA identity (a whole-resource self-copy is API-invalid; same-ROOT-through-
# distinct-views is LEGAL -- disjoint ranges, the provider/13d validates).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "copy"
summary = "Copy a resource (or a subresource via a view) from src to dst; operand order is (dst, src)."
version = 1
operands = [
    { name = "dst", type = "resource", doc = "the DESTINATION (written); a Buffer/Image or a View of one" },
    { name = "src", type = "resource", doc = "the SOURCE (read); a Buffer/Image or a View of one" },
]
effects = [ { family = "MemoryWrite", operand = 0 }, { family = "MemoryRead", operand = 1 } ]
docs = "transfer.copy(%dst, %src). ⛔ (dst, src) order. Static effects: MemoryWrite{dst} + MemoryRead{src}. find_transfer_misuse: dst transferable -> src transferable -> src != dst (CopySrcIsDst)."

# ----------------------------------------------------------------------------------------------------------------------
# transfer.upload -- move host data INTO a device resource. Writes dst. The host data IDENTITY is the OPEN `source` symbol
# (unchecked -- the name/alias_group precedent; the provider resolves it at 13d). ⛔ upload declares ONLY Write{dst} (not a
# GPUCommand-only baseline like a dispatch): the host source is PROVIDER-side, so there is no IR op-pair whose ordering
# could be lost -- Write{dst}-then-Read{dst} on the device side is the upload->first-read barrier, by construction.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "upload"
summary = "Upload host data into a device resource (writes dst); the host source is a provider-resolved identity."
version = 1
operands = [ { name = "dst", type = "resource", doc = "the destination device resource (written)" } ]
attributes = [ { name = "source", kind = "symbol", required = false, doc = "an OPEN host-data identity tag (unchecked; the provider resolves it at 13d -- the name/alias_group precedent)" } ]
effects = [ { family = "MemoryWrite", operand = 0 } ]
docs = "transfer.upload(%dst) {source=@h}. Host->device. Static effect: MemoryWrite{dst}. find_transfer_misuse: dst transferable."

# ----------------------------------------------------------------------------------------------------------------------
# transfer.readback -- move a device resource's data OUT to the host. Reads src. RESULTLESS -- host materialization is
# provider-side (the sec-129 oracle compares outside the IR); the OPEN `dest` symbol is the host destination identity.
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "readback"
summary = "Read a device resource back to the host (reads src); the host destination is a provider-resolved identity."
version = 1
operands = [ { name = "src", type = "resource", doc = "the source device resource (read)" } ]
attributes = [ { name = "dest", kind = "symbol", required = false, doc = "an OPEN host-destination identity tag (unchecked; provider-resolved at 13d)" } ]
effects = [ { family = "MemoryRead", operand = 0 } ]
docs = "transfer.readback(%src) {dest=@h}. Device->host, RESULTLESS (host materialization is provider-side). Static effect: MemoryRead{src}. find_transfer_misuse: src transferable."

# ----------------------------------------------------------------------------------------------------------------------
# transfer.clear -- clear a resource to a value. Writes dst. `value` is the buffer FILL WORD (vkCmdFillBuffer's u32 pattern;
# optional, default 0) -- a semantic PAYLOAD, so it gets the arith.const fold treatment. ⛔ a TYPED image clear is 13d/render
# (RAH-1a.1's clear_kind/clear_uint): a `value` on an IMAGE clear is ClearValueOnImage (the fill-word is a buffer concept);
# an image clear with NO value is well-formed (clear-to-zero / the typed clear lands at 13d).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "clear"
summary = "Clear a resource to a value (the buffer fill word); a typed image clear is CEIR-13d."
version = 1
operands = [ { name = "dst", type = "resource", doc = "the resource to clear (written); a Buffer/Image or a View of one" } ]
attributes = [ { name = "value", kind = "int", required = false, doc = "the buffer FILL WORD (u32 pattern; absent = 0). ⛔ a `value` on an IMAGE clear is ClearValueOnImage -- typed image clears are 13d/render" } ]
effects = [ { family = "MemoryWrite", operand = 0 } ]
docs = "transfer.clear(%dst) {value=N}. Static effect: MemoryWrite{dst}. find_transfer_misuse: dst transferable -> value kind-fold (ClearValueInvalid if present + non-Int) -> value placement (ClearValueOnImage if present + dst underlying is Image)."

# ----------------------------------------------------------------------------------------------------------------------
# transfer.mip_gen -- generate the mip chain of an IMAGE (reads the base level, writes the derived levels). ReadWrite on the
# one operand. find_transfer_misuse: the operand's effective kind (through a view one-hop) must be Image (MipGenNotImage).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "mip_gen"
summary = "Generate the mip chain of an image (reads the base level, writes the derived levels)."
version = 1
operands = [ { name = "image", type = "resource", doc = "the image whose mip chain is generated (read+written); an Image or a View of one" } ]
effects = [ { family = "MemoryReadWrite", operand = 0 } ]
docs = "transfer.mip_gen(%image). Static effect: MemoryReadWrite{image}. find_transfer_misuse: the operand (through a view one-hop) is an Image (else MipGenNotImage)."
