# ----------------------------------------------------------------------------------------------------------------------
# audio.delay -- delay a stereo audio buffer by `delay_frames` samples (out[n] = in[n-D], zero before) -- the sec-142
# chain's delay node (absent from render_graph AND hesap-dsp; 31a-2a's NEW kernel). ⛔ OpTrait::StateEdge -- a delay line
# is the classic FEEDBACK element (an echo = delay(mix(source, delayed)): the delay's operand is defined LATER, so
# StateEdge is what makes the 5d verifier accept the back-edge instead of FeedbackWithoutState -- as biquad). NOT Pure.
# find_audio_misuse: `delay_frames` >= 0 (DelayFramesInvalid, NO upper bound -- D >= frames = all-zero output);
# operand+result Tensor (OperandNotTensor); result type == input type (ResultTypeMismatch).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "delay"
summary = "Delay a stereo audio buffer by delay_frames samples (out[n] = in[n-D], zero before). StateEdge (a delay line -- the classic feedback echo); NOT Pure. result type == input type."
version = 1
determinism = "BitExact"
domain = "HostAudioTime"
operands = [
    { name = "input", type = "tensor", doc = "the audio buffer to delay (a [frames,2] f32 Tensor)." },
]
results = [
    { name = "result", type = "tensor", doc = "the delayed buffer; result type == input type EXACTLY (ResultTypeMismatch otherwise) -- the delay preserves the buffer shape." },
]
attributes = [
    { name = "delay_frames", kind = "int", required = true, doc = "the delay in samples (>= 0): out[n] = in[n - delay_frames], zero for n < delay_frames. find_audio_misuse: present+Int and >= 0 (DelayFramesInvalid). NO upper bound -- D >= frames yields all-zero output." },
]
traits = ["StateEdge"]
docs = "audio.delay(%input) {delay_frames} -> %result. Delay a stereo audio buffer by delay_frames samples (out[n] = in[n-D], zero before) -- the sec-142 chain's delay node (absent from render_graph AND hesap-dsp; 31a-2a's new kernel). ⛔ OpTrait::StateEdge -- a delay line is the classic FEEDBACK element (an echo = delay(mix(source, delayed)): the delay's operand is defined LATER, and StateEdge is what makes the 5d verifier accept the back-edge instead of FeedbackWithoutState -- the 9b DAW form, as biquad). NOT Pure (a stateful op). ⛔ result type == input type -- the delay preserves the buffer shape. find_audio_misuse: `delay_frames` present+Int >= 0 (DelayFramesInvalid, no upper bound); operand+result Tensor-kinded (OperandNotTensor); result type == input type (ResultTypeMismatch). The generated verify_delay owns the STRUCTURAL contract (1 operand, 1 result, delay_frames present+kind)."

# ----------------------------------------------------------------------------------------------------------------------
# audio.compressor -- a feed-forward peak compressor over a stereo audio buffer (the sec-142 chain's dynamics node; the
# LAST sec-142 node, absent from render_graph AND hesap-dsp -- 31a-2b's NEW kernel, genuinely-new numerics). PEAK detector,
# stereo-LINKED (d = max(|L|,|R|)); a linear-domain one-pole envelope (env = c*env + (1-c)*d, c = exp(-1/(ms*1e-3*sr)),
# attack when d>env else release); a hard-knee static curve on 20*log10(env) (gain_db = (env_db>threshold_db) ?
# (env_db-threshold_db)*(1/ratio-1) : 0, equivalently min(0,...) for ratio>=1); the same gain to both channels; NO makeup
# gain (a following audio.gain). ⛔ OpTrait::StateEdge -- the
# envelope is a stateful recurrence (as biquad/delay; threaded across blocks by the executor). sample_rate is NOT an attr:
# it rides the GRAPH (an audio.graph_meta op -- 31a-2b-ii), the kernel takes it as sr. NOT Pure. find_audio_misuse:
# `ratio` >= 1 (CompressorRatioInvalid); `attack_ms` > 0 (CompressorAttackInvalid); `release_ms` > 0
# (CompressorReleaseInvalid); threshold_db unrestricted; operand+result Tensor (OperandNotTensor); result type == input
# type (ResultTypeMismatch).
# ----------------------------------------------------------------------------------------------------------------------
[[op]]
name = "compressor"
summary = "A feed-forward peak compressor over a stereo audio buffer (peak linked detector, one-pole envelope, hard-knee static curve, no makeup). StateEdge (a stateful envelope); NOT Pure. result type == input type."
version = 1
determinism = "BitExact"
domain = "HostAudioTime"
operands = [
    { name = "input", type = "tensor", doc = "the audio buffer to compress (a [frames,2] f32 Tensor)." },
]
results = [
    { name = "result", type = "tensor", doc = "the compressed buffer; result type == input type EXACTLY (ResultTypeMismatch otherwise) -- the compressor preserves the buffer shape." },
]
attributes = [
    { name = "threshold_db", kind = "float", required = true, doc = "the compression threshold in dB (unrestricted -- any dB is legal). Above it the gain reduces per the ratio; below it the gain is unity." },
    { name = "ratio", kind = "float", required = true, doc = "the compression ratio (>= 1; 1 = no compression, oo = limiter). find_audio_misuse: present+Float and ratio >= 1 (CompressorRatioInvalid)." },
    { name = "attack_ms", kind = "float", required = true, doc = "the envelope attack time in milliseconds (> 0): the one-pole coefficient exp(-1/(attack_ms*1e-3*sr)) applied when the detector rises above the envelope. find_audio_misuse: present+Float and attack_ms > 0 (CompressorAttackInvalid)." },
    { name = "release_ms", kind = "float", required = true, doc = "the envelope release time in milliseconds (> 0): the one-pole coefficient exp(-1/(release_ms*1e-3*sr)) applied when the detector falls below the envelope. find_audio_misuse: present+Float and release_ms > 0 (CompressorReleaseInvalid)." },
]
traits = ["StateEdge"]
docs = "audio.compressor(%input) {threshold_db, ratio, attack_ms, release_ms} -> %result. A feed-forward peak compressor over a stereo audio buffer (the sec-142 chain's LAST node -- dynamics; absent from render_graph AND hesap-dsp; 31a-2b's new kernel). A PEAK detector, stereo-LINKED (d = max(|L|,|R|)); a linear-domain one-pole envelope (env = c*env + (1-c)*d; c = exp(-1/(ms*1e-3*sr)); attack when d>env else release); a hard-knee static curve on 20*log10(env) (gain_db = (env_db>threshold_db) ? (env_db-threshold_db)*(1/ratio-1) : 0, equivalently min(0,...) for ratio>=1); the SAME gain to both channels (update-then-gain, feed-forward); NO makeup gain (a following audio.gain). ⛔ OpTrait::StateEdge -- the envelope is a STATEFUL RECURRENCE (as biquad/delay; the envelope state is node-internal, threaded across blocks by the executor). ⛔ sample_rate is NOT an attr -- it rides the GRAPH (an audio.graph_meta op the executor reads, 31a-2b-ii); the kernel takes sr directly. NOT Pure. ⛔ result type == input type -- the compressor preserves the buffer shape. find_audio_misuse: `ratio` present+Float >= 1 (CompressorRatioInvalid); `attack_ms` present+Float > 0 (CompressorAttackInvalid); `release_ms` present+Float > 0 (CompressorReleaseInvalid); threshold_db unrestricted; operand+result Tensor-kinded (OperandNotTensor); result type == input type (ResultTypeMismatch). The generated verify_compressor owns the STRUCTURAL contract (1 operand, 1 result, threshold_db+ratio+attack_ms+release_ms present+Float)."
