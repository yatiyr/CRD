# ceir.task -- host/job execution ops (sec 38, the sec 31 host-job/fiber integration). CEIR-6b: `parallel_for`, the
# data-parallel counted loop. ⛔ HOST-ONLY VOCABULARY here (ADR-0109): the OPS are host-authorable and live in crd-ceir;
# the crd-jobs PROVIDER that lowers them onto crd::jobs::parallel_for lives in the crd-ceir-host BRIDGE (crd-ceir never
# link-edges to crd-jobs). CEIR-6z adds `map_reduce` -- the in-IR fixed-order reduction (the band-6 gate). sec 38's
# residual SIX ops -- spawn / continuation / main-thread / worker / fiber-wait / task-group -- + jobs-backed launch/await
# route to CEIR-8 (compiled host plan; routed at 6z); PRIORITY landed at CEIR-6c (RealtimeClass->jobs::Priority in the
# bridge), DEADLINE -> CEIR-21/26 (no crd-jobs deadline primitive). NO-FOLLOW: named, never silently subset.
schema_version = 1
dialect = "task"
summary = "Host/job execution ops (sec 38): the data-parallel loop (parallel_for) + the fixed-order map_reduce, lowered onto crd-jobs by the crd-ceir-host bridge."

[[op]]
name = "parallel_for"
summary = "A data-parallel counted loop: run the body region for each index in [lower, upper) stepping by step, on the host job provider."
version = 1
operands = [ { name = "lower", type = "any" }, { name = "upper", type = "any" }, { name = "step", type = "any" } ]
regions = [ { kind = "graph", args = [ { name = "iv", type_hint = "the induction variable (an index) for this parallel iteration" } ] } ]
effects = ["Synchronization"]
docs = "task.parallel_for(%lo, %hi, %step) { ^body(%iv): ... core.yield %v }. ⛔ HOST PROVIDER (crd-ceir-host, CEIR-6b): lowered to crd::jobs::parallel_for -- each index runs the body via a FRESH interpreter (per-range, from a prototype) over the shared CONST Context; the per-index yield is collected into the provider's map buffer (IExecutionProvider::map_output). ⛔ PARALLEL PURITY (pre-flight-enforced on the submitting thread): the body AND its resolved callees must be STATE-FREE (no StateEdge cell -- a cell would make results depend on the range split, destroying the {1..16} bit-identity) and yield EXACTLY one value (arg: %iv). ⛔ The body must also be SELF-CONTAINED: it uses only its block-arg (%iv) + body-local defs (inline consts) + self-contained calls -- OUTER captures are NOT seeded into the per-index interpreters (a captured value is an UndefinedValue at execution); capture-seeding is a named later refinement. The in-IR reduction is task.map_reduce -- CEIR-6z. Declares an ambient Synchronization effect (it blocks on a jobs counter) -> illegal in an audio-real-time region (the 6a flip); determinism Unspecified (fails Deterministic mode, honestly -- the 6a finding)."

[[op]]
name = "map_reduce"
summary = "A data-parallel map + a fixed-order (index-order) reduction: map each index in [lower, upper) via the map region, then fold the results left-to-right from init via the combine region."
version = 1
operands = [ { name = "lower", type = "any" }, { name = "upper", type = "any" }, { name = "step", type = "any" }, { name = "init", type = "any" } ]
results = [ { name = "result", type = "any", doc = "the reduced value (init folded over the map results in index order)" } ]
regions = [ { kind = "graph", args = [ { name = "iv", type_hint = "the induction variable (an index) for this parallel map iteration" } ] }, { kind = "graph", args = [ { name = "acc", type_hint = "the reduction accumulator (init on the first fold step)" }, { name = "elem", type_hint = "the map result at the current index" } ] } ]
effects = ["Synchronization"]
docs = "task.map_reduce(%lo, %hi, %step, %init) map { ^m(%iv): ... core.yield %v } combine { ^c(%acc, %elem): ... core.yield %next } -> %result. ⛔ HOST PROVIDER (crd-ceir-host, CEIR-6z): the MAP region runs in PARALLEL (crd::jobs::parallel_for -- fresh per-item interpreters over the shared const Context, disjoint index-order output slots, exactly as task.parallel_for); the COMBINE region then folds those results SEQUENTIALLY in INDEX ORDER (acc = init; acc = combine(acc, out[i]) for i = 0..count) on ONE fresh sub-interpreter. ⭐ The result is num_jobs-INDEPENDENT and BIT-IDENTICAL across {1..16}: the map output is index-order-disjoint (split-independent) and the fold order is FIXED (index order), so even a NON-associative combine is deterministic -- the sec 30/sec 31 band-6 gate. ⛔ PARALLEL PURITY (pre-flight): BOTH regions state-free (no StateEdge, transitively) + self-contained; the map yields EXACTLY 1 (arg: %iv), the combine yields EXACTLY 1 (args: %acc, %elem -- arg count checked so invoke_region's block-arg bind never reads OOB). Declares an ambient Synchronization effect (it blocks on a jobs counter) -> illegal in an audio-real-time region (the 6a flip); determinism Unspecified. The map output is also stashed for IExecutionProvider::map_output inspection (sec 118 parity)."
