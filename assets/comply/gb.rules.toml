[[rule]]
id = "gb.uk-gdpr"
kind = "obligation"
topic = "privacy"
state = "planned"
title = "UK GDPR"
instrument = "UK GDPR (retained Regulation (EU) 2016/679)"
article = "Articles 3, 5-6, 8, 12-12A, 21, 27, 32-34, 44A, 45A-46 and 49"
primary = "https://www.legislation.gov.uk/eur/2016/679"
read = true
obligation = "The UK GDPR binds a controller outside the UK that offers goods or services to people in the UK or monitors their behaviour there (Article 3(2)), which designates a representative in the UK in writing unless its processing is occasional and unlikely to risk their rights (Article 27); process under the Article 5 principles and be able to show it, on an Article 6(1) basis (the recognised legitimate interests of Annex 1 included); where consent is the basis for an information society service offered directly to a child under 13, the holder of parental responsibility gives or authorises it, with reasonable efforts to verify (Article 8); act on a rights request without undue delay and within one month of the relevant time, extendable by two months by a reasoned notice inside the first month (Articles 12-12A), and present the right to object clearly and separately at the first communication (Article 21(4)); secure processing appropriately to the risk (Article 32); notify the Information Commission of a breach within 72 hours unless it is unlikely to risk people's rights, tell the data subjects of a high-risk one and document every breach (Articles 33-34); transfer outside the UK only under the Secretary of State's approval regulations, appropriate safeguards whose data protection test the controller reasonably judges met, or an Article 49 derogation (Articles 44A, 45A-46 and 49)."
applies_to = ["flow.crash-reports", "flow.telemetry", "flow.network-identity", "flow.anticheat", "flow.account-data", "flow.payments", "flow.user-content", "flow.communications"]
check = "planned"
