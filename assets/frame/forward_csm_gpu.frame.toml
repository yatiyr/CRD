# ⭐⭐ REN-40-A: `forward_csm` WITH THE FRUSTUM CULL ON THE DEVICE — the whole 1M path, authored.
#
# ⛔⛔ THIS IS WHY WE HAVE OUR OWN FRAME GRAPH. Six compute passes and five raster passes in ONE graph, ONE
# submission, ordered and barriered by DECLARED READS AND WRITES. `cull_reset` writes the commands; each
# `cull_viewN` reads them and writes back into them AND into `instances`; every geometry pass reads `instances`.
# Nothing here is a hand-built C++ sequence with a comment asking the next person to keep the calls in order —
# the order is a property of the data, and the graph REFUSES to build if the declarations are ambiguous.
#
# ⭐ MEASURED MOTIVATION (`docs/bench/2026-07-29-ren40-million-instance-baseline.md`): at 1M instances the CPU
# frustum cull (5M `aabb_in_frustum` tests: camera + 4 cascades) plus the per-frame visible-list uploads were
# ~160 ms of a 337 ms frame. This graph moves all of it onto the device: the CPU never learns a visible count.
#
# ⛔ ONE AUTHORED KERNEL, FIVE VIEWS. `cull_view0` is the camera; `cull_viewN` is cascade N-1. The suffix IS the
# view index — the renderer cooks one variant of `scene_cull_compact.crdv` per view, baking `view_index` (which
# visible list it fills) and the command offset (which command it accumulates into) as COOK-TIME constants.
# Five passes a reader can count beat a `for_each` expansion nobody can see.
#
# ⛔ THE COMPACTED LISTS ARE NOT NEW RESOURCES. Each kernel writes its list back into `instances` at
# `visible_off + view_index * capacity` — the CPU cull's layout VERBATIM — so every vertex program keeps reading
# its list from exactly where it always did and NOT ONE SHADER CHANGES between the CPU and GPU paths.
#
# ⛔ `requires = ["shadows"]` and the named fallback are the same capability tier the other CSM frames carry: a
# device or scene without cascades steps down by NAME and the step-down is REPORTED, never silent.
schema   = 1
name     = "engine://frame/forward_csm_gpu"
requires = ["shadows"]
fallback = "engine://frame/forward_agx"

[[resource]]
name = "instances"
kind = "external_buffer"

# (1 + cascades) indexed-indirect commands per mesh group, at the backend's command stride. `instance_count` is
# the accumulator each cull adds into; every other field is laid down by `cull_reset`.
[[resource]]
name       = "cull_args"
kind       = "indirect_args"
size_bytes = 256

[[resource]]
name    = "shadow_atlas"
kind    = "persistent_image"
format  = "D32Float"
width   = 2048
height  = 2048
layers  = 4
sampled = true

[[resource]]
name    = "scene_hdr"
kind    = "transient_image"
format  = "R11G11B10F"
scale   = 1.0
sampled = true

# ── ⭐ REN-40-G3: the depth buffer is a FIRST-CLASS resource — readable by the HZB builder, writable ────────
# by the depth prepass, and shared by the forward+impostor passes as their depth attachment. A companion
# depth cannot be sampled; a standalone D32Float with `sampled = true` CAN.
[[resource]]
name    = "scene_depth"
kind    = "transient_image"
format  = "D32Float"
scale   = 1.0
sampled = true

# ⭐⭐ REN-41 (velocity): per-object MOTION VECTORS, written by the depth prepass (now MRT) and sampled by the TAA
# resolve. Cleared to 0 so a pixel with no mover reprojects from the camera only.
[[resource]]
name    = "velocity"
kind    = "transient_image"
format  = "RGBA16F"
scale   = 1.0
sampled = true

# REN-40-G3: half-res min-depth for occlusion culling. The HZB builder reads `scene_depth` and writes the
# min of each 2×2 block; the occlusion cull pass samples it to reject objects behind the depth prepass output.
[[resource]]
name    = "hzb"
kind    = "transient_image"
format  = "R32F"
scale   = 0.5
sampled = true

# ── ⭐⭐ REN-41 (TAA): the temporal-AA history + resolve targets. ─────────────────────────────────────────────
# `taa_history` is PERSISTENT (it carries the accumulated result across frames — the whole point of temporal AA).
# `scene_taa` is the resolved output this frame reads for display AND the copy stores into history for next frame.
# `taa_constants` carries the reproject matrix the resolve needs (the renderer uploads it each frame).
[[resource]]
name      = "taa_history"
kind      = "persistent_image"
format    = "R11G11B10F"
scale     = 1.0
resizable = true   # ⭐⭐⭐ REN-41: follow the window; a resize discards history for ONE frame (reconverges invisibly)
sampled   = true

[[resource]]
name    = "scene_taa"
kind    = "transient_image"
format  = "R11G11B10F"
scale   = 1.0
sampled = true

[[resource]]
name = "taa_constants"
kind = "external_buffer"

# ── the GPU-driven cull: reset, then one dispatch per view ───────────────────────────────────────────────────
# ⛔⛔ EVERY cull pass declares `cull_args` as a WRITE ONLY, never also a read — and that is not a shortcut, it is
# what the accumulation IS. `cull_reset` lays the command down; each `cull_viewN` adds into `instance_count`. A
# read-modify-write is a WRITE with a write-after-write dependency on the previous writer, and the graph orders
# same-resource writers by DECLARATION ORDER (its stated tie-break). Declaring the read as well would claim each
# view depends on every other view's write — a genuine CYCLE, which the graph correctly REFUSED to build when this
# file first said it. The hazard between consecutive writers is covered by the dispatching verb's own
# compute-write barrier (SHADER_READ | INDIRECT_COMMAND_READ in the destination mask), so the reader of these
# commands — the depth-only and forward passes below — sees finished counts.
# ── ⭐⭐ REN-40-F: GPU skinning — palette computation on the device, BEFORE any cull or draw ─────────────────
# One compute dispatch per skinned group (workgroup=64, dispatch = ceil(instance_count/64)). Non-skinned groups
# get dispatch_groups=0 (skipped). Writes the palette section of each group's buffer in place; subsequent VS
# reads happen through the same `instances` resource.
# ⭐⭐ REN-41 (velocity, skinned): snapshot LAST frame's bone palette → prev_palette BEFORE gpu_skin overwrites it,
# so the velocity prepass deforms by the previous pose. Writes "instances" (the group-buffer proxy) so the WAW
# edge orders it before gpu_skin. No-ops unless GPU skinning is active (kHdrGpuSkinActive).
[[pass]]
name      = "palette_snapshot"
kind      = "compute"
kernel    = "engine://scene/palette_snapshot"
draw_list = "visible_geometry"
writes    = ["instances"]

[[pass]]
name      = "gpu_skin"
kind      = "compute"
kernel    = "engine://scene/gpu_skin"
draw_list = "visible_geometry"
writes    = ["instances"]

[[pass]]
name      = "cull_reset"
kind      = "compute"
kernel    = "engine://scene/cull_reset"
draw_list = "visible_geometry"
writes    = ["instances", "cull_args"]

[[pass]]
name      = "cull_view0"
kind      = "compute"
kernel    = "engine://scene/cull_view0"
draw_list = "visible_geometry"
writes    = ["instances", "cull_args"]

[[pass]]
name      = "cull_view1"
kind      = "compute"
kernel    = "engine://scene/cull_view1"
draw_list = "shadow_casters"
writes    = ["instances", "cull_args"]

[[pass]]
name      = "cull_view2"
kind      = "compute"
kernel    = "engine://scene/cull_view2"
draw_list = "shadow_casters"
writes    = ["instances", "cull_args"]

[[pass]]
name      = "cull_view3"
kind      = "compute"
kernel    = "engine://scene/cull_view3"
draw_list = "shadow_casters"
writes    = ["instances", "cull_args"]

[[pass]]
name      = "cull_view4"
kind      = "compute"
kernel    = "engine://scene/cull_view4"
draw_list = "shadow_casters"
writes    = ["instances", "cull_args"]

# ── the cascades: unchanged from forward_csm_agx except that their counts now arrive from `cull_args` ────────
[[draw_list]]
name = "shadow_casters"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "front_to_back"

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[pass]]
name             = "csm_cascade"
kind             = "raster.depth_only"
draw_list        = "shadow_casters"
for_each         = "light.0.cascades"
writes           = ["shadow_atlas[$index]"]
reads            = ["instances", "cull_args"]
material_pass    = "Shadow"
clear_depth      = 1.0
depth            = "LessEqual"
depth_bias_slope = 1.5

[[draw_list]]
name = "impostor_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"

# REN-40-G1+G3 + ⭐⭐ REN-41 (velocity): depth prepass — now MRT, writing MOTION VECTORS ([velocity]) alongside
# `scene_depth`. scene_depth is the depth attachment (a depth-format write routes to the depth slot) AND the graph
# producer the forward `shared_depth` load and the HZB builder order after. The velocity FS carries the SAME LOD
# dither discard as the forward FS, so prepass depth exists for exactly the pixels the forward keeps.
[[pass]]
name          = "depth_prepass"
kind          = "raster.mrt"
draw_list     = "visible_geometry"
writes        = ["velocity", "scene_depth"]
reads         = ["instances", "cull_args"]
material_pass = "Shadow"
clear_color   = [0.0, 0.0, 0.0, 0.0]
clear_depth   = 0.0
depth         = "GreaterEqual"

# REN-40-G3: HZB builder — half-res MIN reduction of scene_depth. The occlusion cull pass samples this to
# reject objects behind the depth prepass output. Reverse-Z: MIN = farthest surface in each 2×2 block.
# `depth_as_float` makes the executor bind a REGULAR sampler (not comparison) so the shader reads the raw
# stored depth value instead of a 0/1 comparison result.
[[pass]]
name           = "hzb_build"
kind           = "raster.fullscreen"
reads          = ["scene_depth"]
writes         = ["hzb"]
shader         = "engine://scene/hzb_build"
depth_as_float = true

# ── ⭐ REN-40-G3 PHASE 2: OCCLUSION RE-CULL — same visible set, filtered by the HZB. ──────────────────────
# The cascade draws and depth prepass have already consumed phase-1's commands. The re-reset zeroes the camera's
# command; the occlusion cull re-compacts with frustum + HZB → the forward pass draws only non-occluded geometry.
# ⛔ CASCADE COMMANDS ARE ALSO RESET HERE. That is correct: the cascade draws ran BEFORE the depth prepass, so
# their commands are fully consumed. Resetting all views keeps ONE reset kernel for both phases.
[[pass]]
name      = "occlusion_reset"
kind      = "compute"
kernel    = "engine://scene/cull_reset"
draw_list = "visible_geometry"
writes    = ["instances", "cull_args"]

[[pass]]
name      = "occlusion_cull"
kind      = "compute"
kernel    = "engine://scene/occlusion_cull"
draw_list = "visible_geometry"
reads     = ["hzb"]
writes    = ["instances", "cull_args"]

[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
writes        = ["scene_hdr"]
reads         = ["shadow_atlas", "instances", "cull_args"]
shared_depth  = "scene_depth"
load_depth    = true
technique     = "forward_csm"
material_pass = "Forward"
clear_color   = [0.09, 0.10, 0.13, 1.0]
depth         = "GreaterEqual"

# REN-40-C5: the impostor billboard pass draws AFTER the forward pass onto the same target (load = true).
# Impostors are far-field: they depth-test against the scene and never cast shadows.
[[pass]]
name         = "impostor"
kind         = "raster.geometry"
draw_list    = "impostor_geometry"
writes       = ["scene_hdr"]
reads        = ["instances", "cull_args"]
shared_depth = "scene_depth"
shader       = "engine://scene/impostor"
load         = true
depth        = "GreaterEqual"

# ── ⭐⭐ REN-41 (TAA): reproject + accumulate. Reads the current colour, the depth (reprojection), and last
# frame's history; writes the resolved image. `taa_store` copies the resolved image into the persistent history
# for next frame (a ping-pong can't be read-after-write in one frame, so the persistent+copy pattern is used).
# ⛔ scene_hdr + scene_depth + taa_history are bound as the bindless heap in DECLARATION ORDER (indices 0/1/2);
# taa_constants is the b0 constants buffer (draw_bindless_storage).
[[pass]]
name   = "taa_resolve"
kind   = "raster.fullscreen"
reads  = ["scene_hdr", "scene_depth", "taa_history", "velocity", "taa_constants"]
writes = ["scene_taa"]
shader = "engine://scene/taa_resolve"

[[pass]]
name   = "taa_store"
kind   = "copy"
reads  = ["scene_taa"]
writes = ["taa_history"]

[[pass]]
name   = "post"
kind   = "raster.fullscreen"
reads  = ["scene_taa"]
writes = ["@output"]
shader = "engine://post/tonemap_agx"
