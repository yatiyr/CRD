# forward_csm_agx.frame.toml - forward + cascades + TAA + the AgX display transform.
#
# 38-G1: the default forward frame PLUS the authored display transform. A fullscreen `post` pass names a shipped
# `.crdp` graph that resolves the frame to the window. Swapping the tonemap is EDITING THE `shader` LINE BELOW.
#
# ⭐⭐ REN-41 (TAA IS THE DEFAULT): this frame carries temporal antialiasing for EVERY app that uses the flagship
# forward graph — a depth prepass populates a SAMPLED `scene_depth`, a Halton-jittered camera feeds the resolve,
# and the resolve reprojects last frame's history by depth, clamps to the current 3×3 neighbourhood, and blends.
# Applications inherit clean edges by default and can delete the three TAA passes to opt out. The device-cull twin
# is `forward_csm_gpu` (same TAA, plus the six compute cull passes).

schema = 1
name   = "crd://frame/forward_csm_agx"
# ⭐ SHADOWS ON/OFF is a DECLARED CAPABILITY TIER with a named fallback (REN-35's rule), not an `if` in the
# renderer. A host without shadows steps down to `forward_agx` — same HDR intermediate, same display transform,
# no atlas and no cascade passes — and the step-down is REPORTED, never silent.
requires = ["shadows"]
fallback = "crd://frame/forward_agx"

[[resource]]
name    = "shadow_atlas"
kind    = "persistent_image"
format  = "D32Float"
width   = 2048
height  = 2048
layers  = 4
sampled = true

# the scene lands HERE first, so the post pass has something to read. `scale = 1.0` follows the window.
[[resource]]
name    = "scene_hdr"
kind    = "transient_image"
# REN-39 fix: a REAL HDR intermediate. RGBA8 quantized + clamped the scene to LDR BEFORE the display
# transform, so switching tonemaps operated on an already-flattened image and looked like a no-op.
format  = "RGBA16F"
scale   = 1.0
sampled = true

# ── ⭐⭐ REN-41 (TAA): a STANDALONE, SAMPLED depth — the reprojection needs to READ per-pixel depth, which a
# companion depth attachment cannot give. The depth prepass writes it; the forward + impostor passes share it as
# their depth attachment (LessEqual/GreaterEqual test); the TAA resolve samples it to reproject history.
[[resource]]
name    = "scene_depth"
kind    = "transient_image"
format  = "D32Float"
scale   = 1.0
sampled = true

# ⭐⭐ REN-41 (velocity): per-object MOTION VECTORS, written by the depth prepass (now MRT) and sampled by the TAA
# resolve. Cleared to 0 so a pixel with no mover reprojects from the camera only.
[[resource]]
name    = "velocity"
kind    = "transient_image"
format  = "RG16F"
scale   = 1.0
sampled = true

# ── ⭐⭐ REN-41 (TAA): the history + resolve targets. `taa_history` is PERSISTENT (it carries the accumulated
# result across frames — the whole point of temporal AA) so it is a FIXED size by engine rule (a scale-relative
# persistent image would silently discard history on resize). `scene_taa` is this frame's resolved output the
# display reads AND the copy stores into history. `taa_constants` carries the reproject matrix (renderer-uploaded).
[[resource]]
name      = "taa_history"
kind      = "persistent_image"
format    = "RGBA16F"
scale     = 1.0
resizable = true   # ⭐⭐⭐ REN-41: follow the window; a resize discards history for ONE frame (reconverges invisibly)
sampled   = true

[[resource]]
name    = "scene_taa"
kind    = "transient_image"
format  = "RGBA16F"
scale   = 1.0
sampled = true

[[resource]]
name = "taa_constants"
kind = "external_buffer"

[[draw_list]]
name = "shadow_casters"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "front_to_back"

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[draw_list]]
name = "impostor_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"

[[pass]]
name             = "csm_cascade"
kind             = "raster.depth_only"
draw_list        = "shadow_casters"
for_each         = "light.0.cascades"
writes           = ["shadow_atlas[$index]"]
material_pass    = "Shadow"
clear_depth      = 1.0
depth            = "LessEqual"
depth_bias_slope = 1.5

# ⭐⭐ REN-41: depth prepass — now MRT, writing MOTION VECTORS ([velocity]) alongside the SAMPLED `scene_depth` (the
# depth-format write routes to the depth slot AND produces scene_depth for the forward `load_depth` share). The
# velocity FS carries the SAME LOD dither discard as the forward FS. Reverse-Z: clear depth 0.0, GreaterEqual.
[[pass]]
name          = "depth_prepass"
kind          = "raster.mrt"
draw_list     = "visible_geometry"
writes        = ["velocity", "scene_depth"]
material_pass = "Shadow"
clear_color   = [0.0, 0.0, 0.0, 0.0]
clear_depth   = 0.0
depth         = "GreaterEqual"

[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
reads         = ["shadow_atlas"]
writes        = ["scene_hdr"]
shared_depth  = "scene_depth"
load_depth    = true
technique     = "forward_csm"
material_pass = "Forward"
clear_color   = [0.09, 0.10, 0.13, 1.0]
depth         = "GreaterEqual"

[[pass]]
name         = "impostor"
kind         = "raster.geometry"
draw_list    = "impostor_geometry"
writes       = ["scene_hdr"]
shared_depth = "scene_depth"
shader       = "crd://scene/impostor"
load         = true
depth        = "GreaterEqual"

# ── ⭐⭐ REN-41 (TAA): reproject + accumulate, then store. `taa_resolve` reads the current colour, the depth (for
# reprojection), and last frame's history; writes the resolved image. `taa_store` copies it into the persistent
# history for next frame (a ping-pong can't be read-after-write in one frame, so persistent + copy is used).
# ⛔ scene_hdr + scene_depth + taa_history are bound as the bindless heap in DECLARATION ORDER (indices 0/1/2);
# taa_constants is the b0 constants buffer (draw_bindless_storage).
[[pass]]
name   = "taa_resolve"
kind   = "raster.fullscreen"
reads  = ["scene_hdr", "scene_depth", "taa_history", "velocity", "taa_constants"]
writes = ["scene_taa"]
shader = "crd://scene/taa_resolve"

[[pass]]
name   = "taa_store"
kind   = "copy"
reads  = ["scene_taa"]
writes = ["taa_history"]

# ⭐⭐ THE DISPLAY TRANSFORM, AS DATA — the 38-G1 technique-library pass. Reads the RESOLVED image, not raw HDR.
[[pass]]
name   = "post"
kind   = "raster.fullscreen"
reads  = ["scene_taa"]
writes = ["@output"]
shader = "crd://post/tonemap_agx"
