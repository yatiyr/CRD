# forward_agx.frame.toml — the SHADOWS-OFF tier of the AgX-tonemapped forward frame.
#
# ⭐ This is `forward_basic`'s rule applied to the tonemapped pair: `forward_csm_agx` says
# `requires = ["shadows"]` and names THIS graph as its fallback, so turning shadows off keeps the HDR
# intermediate and the authored display transform while dropping the atlas and every cascade pass — and the
# step-down is REPORTED, never silent. Without this tier the csm frame simply failed to record with shadows
# off (`for_each` answered 0 cascades) and the app presented a BLACK frame.

schema = 1
name   = "crd://frame/forward_agx"

# the scene lands HERE first, so the post pass has something to read. `scale = 1.0` follows the window.
[[resource]]
name    = "scene_hdr"
kind    = "transient_image"
format  = "RGBA16F"
scale   = 1.0
sampled = true
depth_buffer = true

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
writes        = ["scene_hdr"]
technique     = "standard_forward"
material_pass = "Forward"
clear_color   = [0.09, 0.10, 0.13, 1.0]
clear_depth   = 0.0
depth         = "GreaterEqual"   # reverse-Z

# ⭐⭐ THE DISPLAY TRANSFORM, AS DATA — identical to the csm tier's post pass.
[[pass]]
name   = "post"
kind   = "raster.fullscreen"
reads  = ["scene_hdr"]
writes = ["@output"]
shader = "crd://post/tonemap_agx"
