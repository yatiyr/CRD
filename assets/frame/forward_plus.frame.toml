# forward_plus.frame.toml — CEIR-18a: the AUTHORED Forward+ renderer.
#
# ⛔⛔ WHY THIS EXISTS. The shipped `forward_csm` forward pass shades with the `forward_csm` TECHNIQUE
# (`body_forward_csm` — one directional light + cascaded shadows, a C++ body, NO point-light loop). The scene's
# per-frame POINT-LIGHT array (records 1..N of the light section, B8-m) is therefore consumed by NO live path — the
# only point-light-aware forward FS is the AUTHORED (CEIR) technique `forward_authored` (`cook_lighting` from
# `assets/lighting/scene_forward.crdl`, which declares `point = 4`), and until this file nothing wired it into a frame
# graph. This graph IS that wire: identical to `forward_csm` except the forward pass names `forward_authored`, so the
# scene point lights installed via `SceneRenderer::set_point_lights` actually reach a fragment.
#
# ── STAGING (CEIR-18a-2) ──────────────────────────────────────────────────────────────────────────────────────
#   STAGE 1 (here now): point lights through the live forward pass, clustering OFF. `scene_forward.crdl` declares no
#     `[cluster]` section, so `forward_authored`'s FS walks the point records DIRECTLY (the non-clustered loop) — a
#     200-light scene would cost 200 lights/pixel, which is exactly what Stage 2 fixes.
#   STAGE 2 (DONE — the SIBLING `forward_plus_gpu.frame.toml`): a light-cull COMPUTE pass (`engine://scene/light_cull`)
#     PRODUCES the per-tile light-index list on the device from the froxel-AABB table + light-input the renderer
#     provisions; the clustered FS (`scene_forward_clustered.crdl`, `[cluster]`) walks it. ⛔ THIS file keeps the CPU
#     list (set_cluster_light_list) — the Stage 2a adversarial-list gate needs it; installing forward_plus_gpu would let
#     the device pass's precedence SKIP that list. Which becomes the shipped default is an 18a-2-close decision.
#
# Everything else mirrors `forward_csm` (the cascade atlas + the depth-only cascade expansion + the impostor pass).

schema   = 1
name     = "engine://frame/forward_plus"
# ⭐ SHADOWS remain a DECLARED CAPABILITY TIER with a named fallback (like forward_csm): a host without shadows steps
# down to forward_basic, REPORTED not silent. (forward_basic is directional-only — the point-light wire is a
# forward_plus property; a stepped-down host loses it, which is correct for a shadows-off tier.)
requires = ["shadows"]
fallback = "engine://frame/forward_basic"

# ── the cascade atlas: one 2D-ARRAY depth image, one slice per cascade ──────────────────────────────────────
[[resource]]
name    = "shadow_atlas"
kind    = "persistent_image"
format  = "D32Float"
width   = 2048
height  = 2048
layers  = 4
sampled = true

# ── what casts, and what receives ──────────────────────────────────────────────────────────────────────────
[[draw_list]]
name = "shadow_casters"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "front_to_back"

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[draw_list]]
name = "impostor_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"

# ── ONE declaration -> N cascade passes ────────────────────────────────────────────────────────────────────
[[pass]]
name             = "csm_cascade"
kind             = "raster.depth_only"
draw_list        = "shadow_casters"
for_each         = "light.0.cascades"
writes           = ["shadow_atlas[$index]"]
material_pass    = "Shadow"
clear_depth      = 1.0
depth            = "LessEqual"
depth_bias_slope = 1.5

# ── the shadowed + point-lit forward pass ──────────────────────────────────────────────────────────────────
# ⭐⭐ CEIR-18a: `technique = "forward_authored"` — the CEIR/cook_lighting forward FS. Same DECLARED contract as
# `forward_csm` (same bindings, same ABI order; scene_renderer.cpp scene_authored_technique), so the resolver feeds
# it identically — it just ALSO loops over the scene's point-light records. THIS is the swap the header describes.
# ⭐⭐ CEIR-18a-3 (LANDED): the renderer READS this per-pass `technique` and cooks the shadowed forward FS from it
# (init_programs). ~~ASPIRATIONAL: the renderer does NOT read this field; a consumer MUST call
# set_shadow_technique("forward_authored")~~ — struck: the field is LOAD-BEARING now, editing it re-shades, and NO
# setter is required. (The flat / shadows-off variant is named by the fallback tier: forward_basic → standard_forward.)
[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
reads         = ["shadow_atlas"]
writes        = ["@output"]
technique     = "forward_authored"
material_pass = "Forward"
clear_color   = [0.09, 0.10, 0.13, 1.0]
clear_depth   = 0.0
depth         = "GreaterEqual"

[[pass]]
name      = "impostor"
kind      = "raster.geometry"
draw_list = "impostor_geometry"
writes    = ["@output"]
shader    = "engine://scene/impostor"
load      = true
depth     = "GreaterEqual"
