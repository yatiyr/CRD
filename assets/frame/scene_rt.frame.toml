schema = 1
name   = "engine://frame/scene_rt"

[[resource]]
name = "scene_tlas"
kind = "acceleration_structure"

[[resource]]
name = "hits"
kind = "external_buffer"

[[pass]]
name        = "trace"
kind        = "raytrace.pipeline"
raygen      = "engine://scene/rt/raygen"
miss        = "engine://scene/rt/miss"
closest_hit = "engine://scene/rt/chit"
any_hit     = "engine://scene/rt/anyhit"
reads       = ["scene_tlas"]
writes      = ["hits"]
params      = { groups_x = 4, groups_y = 1 }

[[pass]]
name        = "blank"
kind        = "clear"
writes      = ["@output"]
clear_color = [0.0, 0.0, 0.0, 1.0]
