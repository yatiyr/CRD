name: wpt-debug (TEMP)

# ─────────────────────────────────────────────────────────────────────────────
# TEMPORARY fast-feedback job for the VS2022 (/O2+LTCG) wpt SegFault.
#
# Builds ONLY crd-hesap-wavelet-tests and runs ONLY the wpt test, on the two
# configs that fail (win-release + win-shipping), with the WPT-MARK stderr
# pinpoint markers visible in the log. ~3-5 min vs the full ~30-min matrix.
#
# Trigger: push to ANY non-main branch (the real CI is main-only, so a debug
# branch runs ONLY this), or manual dispatch once it's on the default branch.
#
# DELETE this file — together with the WPT-MARK markers in test_swt_wpt.cpp —
# the moment the miscompile is localized and the real fix is confirmed green.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

env:
  CRD_PERF_BUDGET_SOFT: '1'

jobs:
  wpt-repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [win-release, win-shipping]
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print MSVC version banner (confirm the CI toolchain vs local 14.50)
        shell: cmd
        run: cl 2>&1 & exit /b 0

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.3.290.0-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe" `
            -OutFile VulkanSDK.exe
          Start-Process -FilePath ".\VulkanSDK.exe" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.3.290.0\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ONLY the wavelet test target
        run: cmake --build --preset ${{ matrix.preset }} --target crd-hesap-wavelet-tests

      - name: Run ONLY the wpt test (WPT-MARK pinpoint markers go to stderr)
        shell: cmd
        run: build\${{ matrix.preset }}\tests\hesap-wavelet\crd-hesap-wavelet-tests.exe "wpt:*"
