name: CI

# Three tiers, one coverage contract (docs/design/ci-tiers.md; mapping in .github/ci-tiers.json):
#   preflight  - workflow syntax, tier mapping and the repository/documentation/tooling guards; always runs.
#   change     - the push/PR lanes; selected when engine, test, asset or tool sources change.
#   complete   - every supported non-diagnostic preset; nightly, manual, and whenever the build system, the
#                workflow, the scripts or the third-party register change (a changed build system qualifies itself
#                with conservative scope). Docs-only pushes end after preflight with a meaningful required result.
# The `required` job is the one stable status: it passes only when preflight succeeded and every job the resolved
# tier expected actually ran and passed; a skipped expected job or a failed unexpected job fails it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'change: the push lanes; complete: every supported preset'
        type: choice
        options: [change, complete]
        default: complete

# Cancellation is safe only for superseded pull-request feedback. Push runs on main share one group per ref and are
# never cancelled once running: a newer push replaces only a push run that is still pending, because the newer
# revision contains it and its run qualifies both (the user's decision of 2026-10-19, after per-push complete-tier
# runs queued behind each other for hours). Scheduled and manual complete runs keep their own group (keyed by run
# id), so frequent pushes can never starve or replace them.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.event_name == 'push' && format('push-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Perf budgets (CRD_PERF_BUDGET_LE) are calibrated on dev hardware and are NOT a
# reliable correctness gate on shared/heterogeneous CI runners. Soft mode logs an
# over-budget warning instead of hard-asserting (SIGILL) so hardware variance
# can't fail the suite; the measured work + inner asserts still run. Local dev
# (this var unset) keeps hard enforcement. GitHub also sets CI=true, which the
# macro honors, but we set this explicitly for clarity + non-GitHub runners.
permissions:
  contents: read

env:
  CRD_PERF_BUDGET_SOFT: '1'
  PYTHONUTF8: '1'
  # Lanes that build through the pinned sccache on the GitHub Actions cache backend (docs/design/build-performance.md
  # #hosted-lanes), every one without precompiled headers (docs/design/build-performance.md#the-opt-in-module). Each
  # lane writes under its own namespace (preset, runner image and image version), so lanes and toolchains never share
  # an entry. The list is sized to the repository's 10 GB cache allowance; the uncached lanes and why are in the
  # design document.
  # A quoted scalar folds its line breaks into single spaces, so every name keeps a space on both sides.
  CRD_CACHED_PRESETS: ' win-debug win-asan win-public-checks win-clang-cl win-clang-cl-shipping
    linux-gcc-debug linux-gcc-release linux-gcc-relwithdebinfo linux-gcc-asan
    linux-gcc-public-checks linux-clang-tsan linux-gcc-shipping '
  # REPO.DEV.6: complete-tier presets that never restore an archive cache, so every hosted complete run proves
  # cold acquisition through the verifying helpers (scripts/check-cold-acquisition.py).
  CRD_COLD_PRESETS: ' win-debug-scalar linux-gcc-debug-scalar '

jobs:
  preflight:
    name: Preflight (tier resolution)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: read lets the push base be the last run that resolved its tier (scripts/ci-tier.py base).
    permissions:
      contents: read
      actions: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      reason: ${{ steps.tier.outputs.reason }}
      expected: ${{ steps.tier.outputs.expected }}
      presets_windows: ${{ steps.tier.outputs.presets_windows }}
      presets_clang_tidy: ${{ steps.tier.outputs.presets_clang_tidy }}
      presets_clang_cl: ${{ steps.tier.outputs.presets_clang_cl }}
      presets_linux_gcc: ${{ steps.tier.outputs.presets_linux_gcc }}
      presets_windows_shipping: ${{ steps.tier.outputs.presets_windows_shipping }}
      presets_windows_clang_cl_shipping: ${{ steps.tier.outputs.presets_windows_clang_cl_shipping }}
      presets_linux_gcc_shipping: ${{ steps.tier.outputs.presets_linux_gcc_shipping }}
      presets_windows_native: ${{ steps.tier.outputs.presets_windows_native }}
      presets_linux_arm64: ${{ steps.tier.outputs.presets_linux_arm64 }}
      presets_windows_arm64: ${{ steps.tier.outputs.presets_windows_arm64 }}
    env:
      # pull_request: the base branch tip. A push's base is chosen by the "Choose the comparison base" step.
      CRD_PR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate workflows (actionlint 1.7.12)
        shell: bash
        run: |
          python scripts/pins.py fetch tools actionlint --destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Pinned inputs agree with the registry
        run: python scripts/check-pins.py
      - name: Tier mapping owns every preset
        run: python scripts/check-ci-tiers.py
      - name: Choose the comparison base
        id: base
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push compares with the head of the newest earlier run whose preflight succeeded, not with its own
          # `before`: the push group replaces a pending run with the newer one, and `before..HEAD` would drop the
          # replaced push's changes. No such run, or no answer from the API, leaves the base empty: the complete tier.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "base=$CRD_PR_BASE" >> "$GITHUB_OUTPUT"
          else
            python scripts/ci-tier.py base --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
              --current-run "$GITHUB_RUN_ID" --output "$GITHUB_OUTPUT"
          fi
      - name: Fetch the comparison base
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          CRD_CI_BASE: ${{ steps.base.outputs.base }}
        run: |
          if [[ -z "$CRD_CI_BASE" || "$CRD_CI_BASE" =~ ^0+$ ]]; then
            echo "no base revision; the resolver takes the complete tier"
          elif ! git fetch --no-tags --depth=1 origin "$CRD_CI_BASE"; then
            echo "base $CRD_CI_BASE is unreachable; the resolver takes the complete tier"
          fi
      - name: Resolve the tier
        id: tier
        shell: bash
        env:
          CRD_CI_BASE: ${{ steps.base.outputs.base }}
        run: |
          python scripts/ci-tier.py resolve --event "$GITHUB_EVENT_NAME" --base "$CRD_CI_BASE" --head HEAD \
            --tier "${{ inputs.tier }}" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository checks (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"
      - name: Repository hygiene and layout
        run: python scripts/check-repository.py
      - name: Documentation and roadmap
        run: python scripts/check-master-plan.py
      - name: CI tier mapping
        run: python scripts/check-ci-tiers.py
      - name: Pinned inputs
        run: python scripts/check-pins.py
      - name: Generated sources carry their provenance and bytes
        run: python scripts/check-generated.py
      - name: Allman braces on every control statement
        run: python scripts/check-allman-braces.py
      - name: License manifest follows the registry
        run: python scripts/gen_license_manifest.py --check
      - name: Build tooling regression checks
        run: python scripts/test-repository-tools.py
      - name: Module registry contracts
        run: python scripts/test-module-selection.py
      - name: Affected workflow selection contracts
        run: python scripts/test-dev-workflow.py
      - name: CPU sampling runbook verdicts
        run: python scripts/test-sample-cpu-wpr.py
      - name: Counter capability verdicts
        run: python scripts/test-counters-capability.py
      - name: Debugger recipe verdicts
        run: python scripts/test-debugger-recipes.py
      - name: Reverse debugging verdicts
        run: python scripts/test-reverse-debug-recipes.py
      - name: Seeded detector failure verdicts
        run: python scripts/test-diag-seeded-faults.py
      - name: Diagnostic coverage verdicts
        run: python scripts/test-diag-coverage.py
      - name: Overhead board verdicts
        run: python scripts/test-diag-overhead.py
      - name: Overhead external sampling verdicts
        run: python scripts/test-sample-overhead-wpr.py
      - name: Project structure synchronization
        run: python scripts/test-project-sync.py
      - name: Canonical build profile contracts
        run: python scripts/test-native-build-profiles.py
      - name: Native MSVC profile compile and execution
        if: runner.os == 'Windows'
        run: python scripts/test-native-build-profiles.py --generator "Visual Studio 18 2026"
      - name: Native Visual Studio structure round trips
        if: runner.os == 'Windows'
        run: python scripts/test-project-sync-native.py --generator "Visual Studio 18 2026"
      - name: Linux structure projection and compile
        if: runner.os == 'Linux'
        run: python scripts/test-project-sync-native.py --generator Ninja
      - name: Generated CEIR artifacts
        run: python tools/ceir_opgen/ceir_opgen.py --check
      - name: Capability source references
        run: python tools/ceir_capability_matrix/gen_matrix.py --check

  windows:
    needs: preflight
    if: needs.preflight.outputs.presets_windows != '[]'
    runs-on: windows-2025
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_windows) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Setup MSVC
        shell: pwsh
        run: python scripts/msvc-dev-env.py --github-env "$env:GITHUB_ENV"

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List | Tee-Object -FilePath "$env:RUNNER_TEMP/adapters.txt"

      - name: Cache CPM downloads
        if: "!contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Cache Vulkan SDK
        id: vulkan-cache
        if: "!contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: python scripts/install-vulkan-sdk.py --download-dir "${{ runner.temp }}"

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cold acquisition (empty package cache, pinned WARP)
        if: contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))
        run: |
          python scripts/check-cold-acquisition.py --before "${{ env.CPM_SOURCE_CACHE }}"
          python scripts/install-warp.py --destination "${{ runner.temp }}/warp-cold"

      - name: Install pinned sccache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: python scripts/install-sccache.py --destination "${{ runner.temp }}/sccache"

      # The GitHub Actions cache backend: the cache service's URL and token reach JavaScript actions only, so this step
      # starts the sccache server with them (the token masked) and the lane's namespace (preset, runner image and image
      # version: lanes and toolchains never share an entry), and exports the same settings for the later steps. The
      # server lives until the statistics step stops it. A failed cache request makes sccache compile locally; when
      # the service is missing or the server does not start on it, the lane builds through an empty local cache, so
      # the cache can slow a lane but never fail it.
      - name: Compiler cache service
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CRD_CACHE_LANE: ${{ matrix.preset }}
          CRD_SCCACHE: ${{ runner.temp }}/sccache/sccache.exe
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const url = process.env.ACTIONS_RESULTS_URL || '';
            const image = [process.env.ImageOS || 'image', process.env.ImageVersion || 'unknown'];
            const common = { SCCACHE_IDLE_TIMEOUT: '0', SCCACHE_IGNORE_SERVER_IO_ERROR: '1' };
            const service = {
              SCCACHE_GHA_ENABLED: 'on', SCCACHE_GHA_VERSION: [process.env.CRD_CACHE_LANE, ...image].join('-'),
              ACTIONS_RESULTS_URL: url, ACTIONS_RUNTIME_TOKEN: token,
              ACTIONS_CACHE_SERVICE_V2: process.env.ACTIONS_CACHE_SERVICE_V2 || '',
            };
            let started = false;
            if (token && url) {
              core.setSecret(token);
              try {
                const options = { env: { ...process.env, ...common, ...service }, ignoreReturnCode: true };
                started = (await exec.exec(process.env.CRD_SCCACHE, ['--start-server'], options)) === 0;
              } catch (error) {
                core.warning(`sccache did not start: ${error.message}`);
              }
            }
            const local = { SCCACHE_GHA_ENABLED: 'off', SCCACHE_GHA_VERSION: '' };
            const chosen = started ? { ...common, ...service } : { ...common, ...local };
            for (const [name, value] of Object.entries(chosen)) {
              core.exportVariable(name, value);
            }
            if (started) {
              const v2 = service.ACTIONS_CACHE_SERVICE_V2 || 'no';
              core.info(`sccache serves ${service.SCCACHE_GHA_VERSION} from the cache service (v2: ${v2})`);
            } else {
              core.warning('no cache service for sccache in this job; the lane builds through an empty local cache');
            }

      # Intel SDE 10.13.1 (cmake/pins.json tools/sde-windows, scripts/install-sde.py): the configure reads CRD_SDE from
      # the environment and registers the <suite>-kernels-at-avx512-sde-<cpu> arms (cmake/CrdSimd.cmake), which run
      # the avx512 tables under SDE's CPU models whatever the runner's CPU (ADR-0134 §8). On the optimised lane: its
      # codegen is where the v4 units differ, and debug code under the emulator outlasts any test timeout.
      - name: Install pinned Intel SDE
        if: matrix.preset == 'win-release'
        shell: pwsh
        run: python scripts/install-sde.py --destination "$env:RUNNER_TEMP/sde" --download-dir "$env:RUNNER_TEMP" --github-env "$env:GITHUB_ENV"

      - name: Configure
        if: "!contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))"
        run: cmake --preset ${{ matrix.preset }}

      - name: Cold acquisition (every pinned package acquired)
        if: contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))
        run: >-
          python scripts/check-cold-acquisition.py --after "${{ env.CPM_SOURCE_CACHE }}" --build "build/${{ matrix.preset }}"
          --fetch-unselected "${{ runner.temp }}/cold-unselected"

      # MSVC precompiled headers are non-cacheable (/Fp), so the cached lane compiles every unit standalone; the
      # module embeds debug information (/Z7) for the launcher. Measured: docs/bench (build performance board).
      - name: Configure with the compiler cache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: cmake --preset ${{ matrix.preset }} "-DCRD_COMPILER_LAUNCHER=${{ runner.temp }}/sccache/sccache.exe" -DCRD_ENABLE_PCH=OFF

      # Keep going past a failing unit (`-k 0`): the job still fails, but one run reports every independent failure.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Compiler cache statistics
        if: always() && contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/sccache/sccache.exe" --show-stats --stats-format json | Out-File -FilePath "$env:RUNNER_TEMP/sccache.json" -Encoding utf8
          & "$env:RUNNER_TEMP/sccache/sccache.exe" --show-stats
          & "$env:RUNNER_TEMP/sccache/sccache.exe" --stop-server

      - name: Test inventory
        run: python scripts/ci-evidence.py inventory --build-dir build/${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} -R '^crd-dx12-device-info$' --verbose --timeout 30 --no-tests=error
          $probeExit = $LASTEXITCODE
          $junit = "$env:GITHUB_WORKSPACE\build\${{ matrix.preset }}\Testing\Temporary\ctest-junit.xml"
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --output-junit "$junit"
          $testExit = $LASTEXITCODE
          if ($probeExit -ne 0) { exit $probeExit }
          # Two-sided register gate (docs/third-party-defects.md): the lane is green only when the failing set equals
          # the registered third-party failures for this preset; lanes without entries require zero failures and
          # propagate CTest's exit code. Nothing is suppressed; the sanitizer reports stay in this log.
          python scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit $testExit
          exit $LASTEXITCODE

      # ADR-0134 §4, §8: general code builds at the baseline on every lane, so the old -sse2 builds became this arm.
      # The lane's own binaries run every test again with CRD_CPU_LEVEL=sse2 (the <preset>-at-sse2 test preset); a
      # test that forces its own level keeps it. The hidden [cpu-level-applied] case fails if the level was refused.
      - name: Test at the sse2 level
        if: matrix.preset == 'win-debug'
        shell: pwsh
        run: |
          $env:CRD_CPU_LEVEL = 'sse2'
          & "build\${{ matrix.preset }}\tests\math\crd-math-tests.exe" '[cpu-level-applied]'
          $appliedExit = $LASTEXITCODE
          Remove-Item Env:CRD_CPU_LEVEL
          # Keep the lane pass's log in the evidence: the arm's CTest rewrites LastTest.log.
          $logs = "build\${{ matrix.preset }}\Testing\Temporary"
          Copy-Item "$logs\LastTest.log" "$logs\LastTest-lane.log"
          $junit = "$env:GITHUB_WORKSPACE\build\${{ matrix.preset }}\Testing\Temporary\ctest-junit-at-sse2.xml"
          ctest --preset ${{ matrix.preset }}-at-sse2 --output-on-failure --no-tests=error --output-junit "$junit"
          $testExit = $LASTEXITCODE
          if ($appliedExit -ne 0) { exit $appliedExit }
          python scripts/check-registered-failures.py --lane ${{ matrix.preset }}-at-sse2 --junit "$junit" `
            --ctest-exit $testExit
          exit $LASTEXITCODE

      # DIAG.10b seeded detector failures (docs/design/runtime-diagnostics.md#diag-10b): once the lane's build and
      # tests pass, each seed that applies to the lane breaks one instrument (a sanitizer not compiled in, a report
      # redirected or suppressed, a removed redzone check, a lost fatal record, a half-compared symbol identity),
      # rebuilds its targets and must make the named tests fail with the named text in CTest's JUnit; the tree is
      # restored byte for byte and rebuilt green. Nothing is rerun. The report and every phase's logs and JUnit land in
      # the lane's evidence.
      - name: Seeded detector failures
        if: matrix.preset == 'win-debug' || matrix.preset == 'win-asan'
        shell: pwsh
        run: |
          python scripts/diag-seeded-faults.py --build-dir build/${{ matrix.preset }} --preset ${{ matrix.preset }} `
            --trace-dir build/${{ matrix.preset }}/evidence/diag-seeded-faults

      - name: Evidence bundle and summary
        if: always()
        shell: pwsh
        run: |
          python scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/${{ matrix.preset }} `
            --adapters "$env:RUNNER_TEMP/adapters.txt" --outcome "${{ job.status }}" `
            --sccache-stats "$env:RUNNER_TEMP/sccache.json" `
            --output build/${{ matrix.preset }}/evidence --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  clang-tidy:
    needs: preflight
    if: needs.preflight.outputs.presets_clang_tidy != '[]'
    runs-on: windows-2025
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_clang_tidy) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Setup MSVC
        shell: pwsh
        run: python scripts/msvc-dev-env.py --github-env "$env:GITHUB_ENV"

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List | Tee-Object -FilePath "$env:RUNNER_TEMP/adapters.txt"

      # Pin clang-tidy to LLVM 20.1.8, the version VS2026 ships locally, so hosted
      # and local analysis agree on every check. Constant naming follows
      # `.clang-tidy` (corrected 2026-09-13): 20.1.8 has no
      # `LocalConstexprVariable` option, a non-static function-local `constexpr`
      # is a `LocalConstant` (lower_case) and namespace/class/static constants
      # are `kCamelCase`; see docs/CODING.md. Pinning eliminates the skew that
      # produced silent CI-only failures on patterns the local gate accepted.
      #
      # LLVM's Windows release archive is pinned by digest (cmake/pins.json tools/llvm); the installer verifies it,
      # extracts only clang-tidy.exe (byte-identical to the developer host's LLVM 20.1.8) and clang's builtin headers,
      # checks the binary's digest, the header count and the reported version, and names the binary in CRD_CI_TIDY.
      - name: Install clang-tidy (LLVM 20.1.8, pinned)
        shell: pwsh
        run: python scripts/install-clang-tidy.py --destination "$env:RUNNER_TEMP/clang-tidy" --download-dir "$env:RUNNER_TEMP" --github-env "$env:GITHUB_ENV"

      - name: Verify clang-tidy version
        shell: pwsh
        run: |
          $version = & $env:CRD_CI_TIDY --version
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '\b20\.1\.8\b') {
            throw "Expected LLVM 20.1.8 at $env:CRD_CI_TIDY; got $version"
          }
          Write-Output $version

      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: python scripts/install-vulkan-sdk.py --download-dir "${{ runner.temp }}"

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }} -DCRD_CLANG_TIDY_WARNINGS_AS_ERRORS=ON "-DCLANG_TIDY_EXE=$env:CRD_CI_TIDY"

      # Every translation unit is a strict-analysis check here, so keep going past a failing one (`-k 0`): the job
      # still fails on any finding, but one run reports every independent finding instead of the first few.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Evidence bundle and summary
        if: always()
        shell: pwsh
        run: |
          python scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/${{ matrix.preset }} `
            --adapters "$env:RUNNER_TEMP/adapters.txt" --outcome "${{ job.status }}" `
            --output build/${{ matrix.preset }}/evidence --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: build/*/evidence/**
          if-no-files-found: warn

  clang-cl:
    needs: preflight
    if: needs.preflight.outputs.presets_clang_cl != '[]'
    runs-on: windows-2025
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_clang_cl) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Setup MSVC
        shell: pwsh
        run: python scripts/msvc-dev-env.py --github-env "$env:GITHUB_ENV"

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List | Tee-Object -FilePath "$env:RUNNER_TEMP/adapters.txt"

      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          # Locate clang-cl robustly across runner-image changes: the GitHub windows-latest image has trimmed the
          # VS-bundled LLVM component (and shifts VS year/edition), which broke the old hard-coded
          # `2022\{Enterprise,Community}\VC\Tools\Llvm\x64\bin` lookup. Prefer the VS-bundled LLVM for ANY VS
          # year/edition, then fall back to the standalone C:\Program Files\LLVM (reliably present on the runner),
          # then to whatever clang-cl is already on PATH (the developer environment). Only fail if truly none is found.
          $candidates = @()
          $candidates += Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\x64\bin\clang-cl.exe" `
                          -ErrorAction SilentlyContinue | ForEach-Object { $_.DirectoryName }
          $candidates += "C:\Program Files\LLVM\bin"
          $llvm = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ "clang-cl.exe")) } | Select-Object -First 1
          if (-not $llvm) {
            $cmd = Get-Command clang-cl -ErrorAction SilentlyContinue
            if ($cmd) { $llvm = Split-Path $cmd.Source }
          }
          if (-not $llvm) {
            throw "clang-cl not found (checked VS-bundled LLVM for all editions, C:\Program Files\LLVM, and PATH)"
          }
          Write-Host "Using clang-cl at: $llvm"
          Add-Content -Path $env:GITHUB_PATH -Value $llvm

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: python scripts/install-vulkan-sdk.py --download-dir "${{ runner.temp }}"

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned sccache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: python scripts/install-sccache.py --destination "${{ runner.temp }}/sccache"

      # The GitHub Actions cache backend, as in the windows job.
      - name: Compiler cache service
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CRD_CACHE_LANE: ${{ matrix.preset }}
          CRD_SCCACHE: ${{ runner.temp }}/sccache/sccache.exe
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const url = process.env.ACTIONS_RESULTS_URL || '';
            const image = [process.env.ImageOS || 'image', process.env.ImageVersion || 'unknown'];
            const common = { SCCACHE_IDLE_TIMEOUT: '0', SCCACHE_IGNORE_SERVER_IO_ERROR: '1' };
            const service = {
              SCCACHE_GHA_ENABLED: 'on', SCCACHE_GHA_VERSION: [process.env.CRD_CACHE_LANE, ...image].join('-'),
              ACTIONS_RESULTS_URL: url, ACTIONS_RUNTIME_TOKEN: token,
              ACTIONS_CACHE_SERVICE_V2: process.env.ACTIONS_CACHE_SERVICE_V2 || '',
            };
            let started = false;
            if (token && url) {
              core.setSecret(token);
              try {
                const options = { env: { ...process.env, ...common, ...service }, ignoreReturnCode: true };
                started = (await exec.exec(process.env.CRD_SCCACHE, ['--start-server'], options)) === 0;
              } catch (error) {
                core.warning(`sccache did not start: ${error.message}`);
              }
            }
            const local = { SCCACHE_GHA_ENABLED: 'off', SCCACHE_GHA_VERSION: '' };
            const chosen = started ? { ...common, ...service } : { ...common, ...local };
            for (const [name, value] of Object.entries(chosen)) {
              core.exportVariable(name, value);
            }
            if (started) {
              const v2 = service.ACTIONS_CACHE_SERVICE_V2 || 'no';
              core.info(`sccache serves ${service.SCCACHE_GHA_VERSION} from the cache service (v2: ${v2})`);
            } else {
              core.warning('no cache service for sccache in this job; the lane builds through an empty local cache');
            }

      - name: Configure
        if: "!contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))"
        run: cmake --preset ${{ matrix.preset }}

      # clang-cl's precompiled header (/Yu) is not cacheable either, so the cached lane compiles every unit
      # standalone with its CodeView in the objects (/Z7, the objects clang-cl writes for /Zi too).
      - name: Configure with the compiler cache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: cmake --preset ${{ matrix.preset }} "-DCRD_COMPILER_LAUNCHER=${{ runner.temp }}/sccache/sccache.exe" -DCRD_ENABLE_PCH=OFF

      # Keep going past a failing unit (`-k 0`): the job still fails, but one run reports every independent failure.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Compiler cache statistics
        if: always() && contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/sccache/sccache.exe" --show-stats --stats-format json | Out-File -FilePath "$env:RUNNER_TEMP/sccache.json" -Encoding utf8
          & "$env:RUNNER_TEMP/sccache/sccache.exe" --show-stats
          & "$env:RUNNER_TEMP/sccache/sccache.exe" --stop-server

      - name: Test inventory
        run: python scripts/ci-evidence.py inventory --build-dir build/${{ matrix.preset }}

      - name: Test
        env:
          CRD_PLATFORM_HEADLESS: '1'
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} -R '^crd-dx12-device-info$' --verbose --timeout 30 --no-tests=error
          $probeExit = $LASTEXITCODE
          $junit = "$env:GITHUB_WORKSPACE\build\${{ matrix.preset }}\Testing\Temporary\ctest-junit.xml"
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --output-junit "$junit"
          $testExit = $LASTEXITCODE
          if ($probeExit -ne 0) { exit $probeExit }
          python scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit $testExit
          exit $LASTEXITCODE

      - name: Evidence bundle and summary
        if: always()
        shell: pwsh
        run: |
          python scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/${{ matrix.preset }} `
            --adapters "$env:RUNNER_TEMP/adapters.txt" --outcome "${{ job.status }}" `
            --sccache-stats "$env:RUNNER_TEMP/sccache.json" `
            --output build/${{ matrix.preset }}/evidence --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  linux-gcc:
    needs: preflight
    if: needs.preflight.outputs.presets_linux_gcc != '[]'
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_linux_gcc) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Linux tree links every kernel family once per CPU level into each test program; linux-gcc-asan ran out of
      # root space at link (run 40515770381). Drop the image's preinstalled toolchains that no step here uses.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift             /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev \
            glslang-tools \
            libshaderc-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            mesa-common-dev \
            mesa-vulkan-drivers \
            gdb
          # mesa-vulkan-drivers provides lavapipe, a software Vulkan device: the Vulkan device tests and the Khronos
          # validation layer below run on every push instead of skipping (user decision 2026-10-05).
          # gdb runs the DIAG.9c reverse-debugging and watchpoint routes (the crd-diag-reverse-debug-* CTests).

      - name: Record system package versions
        run: dpkg-query -W -f='${Package} ${Version}\n' libvulkan-dev glslang-tools libshaderc-dev libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev mesa-vulkan-drivers gdb | tee "$RUNNER_TEMP/packages.txt"

      # apt's libvulkan-dev ships ~1.3.275 headers — too old for the NV extensions the engine drives
      # (VK_NV_cluster_acceleration_structure / cooperative_vector / cooperative_matrix2 / linear_swept_spheres).
      # Compile against the pinned Khronos Vulkan-Headers (the same SDK tag as Windows, every file verified by
      # SHA-256 from cmake/pins.json); the runtime loader (libvulkan.so) still comes from apt —
      # headers-newer-than-loader is the supported direction.
      - name: Install pinned Vulkan headers and SPIRV-Reflect
        run: |
          python3 scripts/install-vulkan-headers.py --destination /tmp/vulkan-sdk --download-dir "$RUNNER_TEMP/vulkan-headers"
          echo "VULKAN_SDK=/tmp/vulkan-sdk" >> "$GITHUB_ENV"

      - name: Install matching Vulkan validation layer
        run: |
          validation_dir="$RUNNER_TEMP/cerid-vulkan-validation"
          python3 scripts/install-vulkan-validation.py --destination "$validation_dir"
          echo "VK_LAYER_PATH=$validation_dir/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$validation_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Cache CPM downloads
        if: "!contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Cold acquisition (empty package cache)
        if: contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))
        run: python3 scripts/check-cold-acquisition.py --before "${{ env.CPM_SOURCE_CACHE }}"

      - name: Install pinned sccache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: python3 scripts/install-sccache.py --destination "$RUNNER_TEMP/sccache"

      # The GitHub Actions cache backend, as in the windows job.
      - name: Compiler cache service
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CRD_CACHE_LANE: ${{ matrix.preset }}
          CRD_SCCACHE: ${{ runner.temp }}/sccache/sccache
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const url = process.env.ACTIONS_RESULTS_URL || '';
            const image = [process.env.ImageOS || 'image', process.env.ImageVersion || 'unknown'];
            const common = { SCCACHE_IDLE_TIMEOUT: '0', SCCACHE_IGNORE_SERVER_IO_ERROR: '1' };
            const service = {
              SCCACHE_GHA_ENABLED: 'on', SCCACHE_GHA_VERSION: [process.env.CRD_CACHE_LANE, ...image].join('-'),
              ACTIONS_RESULTS_URL: url, ACTIONS_RUNTIME_TOKEN: token,
              ACTIONS_CACHE_SERVICE_V2: process.env.ACTIONS_CACHE_SERVICE_V2 || '',
            };
            let started = false;
            if (token && url) {
              core.setSecret(token);
              try {
                const options = { env: { ...process.env, ...common, ...service }, ignoreReturnCode: true };
                started = (await exec.exec(process.env.CRD_SCCACHE, ['--start-server'], options)) === 0;
              } catch (error) {
                core.warning(`sccache did not start: ${error.message}`);
              }
            }
            const local = { SCCACHE_GHA_ENABLED: 'off', SCCACHE_GHA_VERSION: '' };
            const chosen = started ? { ...common, ...service } : { ...common, ...local };
            for (const [name, value] of Object.entries(chosen)) {
              core.exportVariable(name, value);
            }
            if (started) {
              const v2 = service.ACTIONS_CACHE_SERVICE_V2 || 'no';
              core.info(`sccache serves ${service.SCCACHE_GHA_VERSION} from the cache service (v2: ${v2})`);
            } else {
              core.warning('no cache service for sccache in this job; the lane builds through an empty local cache');
            }

      # Intel SDE as in the windows job (tools/sde-linux). Pin attaches to the program it starts, which Ubuntu's Yama
      # allows only at ptrace scope 0 (Intel's README).
      - name: Install pinned Intel SDE
        if: matrix.preset == 'linux-gcc-release'
        run: |
          python3 scripts/install-sde.py --destination "$RUNNER_TEMP/sde" --download-dir "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Configure
        if: "!contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))"
        run: cmake --preset ${{ matrix.preset }}

      - name: Cold acquisition (every pinned package acquired)
        if: contains(env.CRD_COLD_PRESETS, format(' {0} ', matrix.preset))
        run: >-
          python3 scripts/check-cold-acquisition.py --after "${{ env.CPM_SOURCE_CACHE }}" --build "build/${{ matrix.preset }}"
          --fetch-unselected "${{ runner.temp }}/cold-unselected"

      # No precompiled header under the cache: a cached one records its inputs' bytes, which the cache key does not
      # hold (docs/design/build-performance.md#the-opt-in-module).
      - name: Configure with the compiler cache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: cmake --preset ${{ matrix.preset }} "-DCRD_COMPILER_LAUNCHER=$RUNNER_TEMP/sccache/sccache" -DCRD_ENABLE_PCH=OFF

      # Keep going past a failing unit (`-k 0`): the job still fails, but one run reports every independent failure.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Compiler cache statistics
        if: always() && contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: |
          "$RUNNER_TEMP/sccache/sccache" --show-stats --stats-format json > "$RUNNER_TEMP/sccache.json"
          "$RUNNER_TEMP/sccache/sccache" --show-stats
          "$RUNNER_TEMP/sccache/sccache" --stop-server

      - name: Test inventory
        run: python3 scripts/ci-evidence.py inventory --build-dir build/${{ matrix.preset }}

      - name: Test
        shell: bash
        run: |
          junit="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/Testing/Temporary/ctest-junit.xml"
          set +e
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --output-junit "$junit"
          test_exit=$?
          set -e
          python3 scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit "$test_exit"

      # ADR-0134 §4, §8: the lane's binaries again with every test at the sse2 level, as on win-debug.
      - name: Test at the sse2 level
        if: matrix.preset == 'linux-gcc-debug'
        shell: bash
        run: |
          set +e
          CRD_CPU_LEVEL=sse2 "build/${{ matrix.preset }}/tests/math/crd-math-tests" '[cpu-level-applied]'
          applied_exit=$?
          # Keep the lane pass's log in the evidence: the arm's CTest rewrites LastTest.log.
          logs="build/${{ matrix.preset }}/Testing/Temporary"
          cp "$logs/LastTest.log" "$logs/LastTest-lane.log"
          junit="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/Testing/Temporary/ctest-junit-at-sse2.xml"
          ctest --preset ${{ matrix.preset }}-at-sse2 --output-on-failure --no-tests=error --output-junit "$junit"
          test_exit=$?
          set -e
          if [[ $applied_exit -ne 0 ]]; then
            exit "$applied_exit"
          fi
          python3 scripts/check-registered-failures.py --lane ${{ matrix.preset }}-at-sse2 --junit "$junit" \
            --ctest-exit "$test_exit"

      # DIAG.10b seeded detector failures, as on win-debug and win-asan: the preset's test environment (the
      # TSan suppressions and options) is the base every seed changes.
      - name: Seeded detector failures
        if: >-
          matrix.preset == 'linux-gcc-debug' || matrix.preset == 'linux-gcc-asan' ||
          matrix.preset == 'linux-clang-tsan'
        run: |
          python3 scripts/diag-seeded-faults.py --build-dir build/${{ matrix.preset }} --preset ${{ matrix.preset }} \
            --trace-dir build/${{ matrix.preset }}/evidence/diag-seeded-faults

      # DIAG.4b weak-memory model (user decision 2026-10-10): GenMC runs in the complete tier beside ThreadSanitizer,
      # whatever the TSan tests concluded. It is built from the pinned source (tools/genmc) against the runner's apt
      # LLVM of the pinned major and cached per pin and LLVM version; the helper rebuilds a cached install whose stamp
      # no longer matches. Both model variants are held to their verdicts: repaired verifies, broken must fail.
      - name: Install GenMC toolchain
        id: genmc-toolchain
        if: "!cancelled() && matrix.preset == 'linux-clang-tsan'"
        run: |
          sudo apt-get install -y llvm-20-dev clang-20 g++-14 libedit-dev
          dpkg-query -W -f='${Package} ${Version}\n' llvm-20-dev clang-20 libllvm20 g++-14 libedit-dev libffi-dev \
            | tee -a "$RUNNER_TEMP/packages.txt"
