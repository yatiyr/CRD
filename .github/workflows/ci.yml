name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Perf budgets (CRD_PERF_BUDGET_LE) are calibrated on dev hardware and are NOT a
# reliable correctness gate on shared/heterogeneous CI runners. Soft mode logs an
# over-budget warning instead of hard-asserting (SIGILL) so hardware variance
# can't fail the suite; the measured work + inner asserts still run. Local dev
# (this var unset) keeps hard enforcement. GitHub also sets CI=true, which the
# macro honors, but we set this explicitly for clarity + non-GitHub runners.
permissions:
  contents: read

env:
  CRD_PERF_BUDGET_SOFT: '1'
  PYTHONUTF8: '1'

jobs:
  repository:
    name: Repository checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          destination: ${{ runner.temp }}/ninja
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflows (actionlint 1.7.12)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Repository hygiene and layout
        run: python scripts/check-repository.py
      - name: Documentation and roadmap
        run: python scripts/check-master-plan.py
      - name: Build tooling regression checks
        run: python scripts/test-repository-tools.py
      - name: Generated CEIR artifacts
        run: python tools/ceir_opgen/ceir_opgen.py --check
      - name: Capability source references
        run: python tools/ceir_capability_matrix/gen_matrix.py --check

  windows:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: [win-debug, win-release, win-asan, win-debug-sse2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          destination: ${{ runner.temp }}/ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/1.4.341.1/windows/vulkansdk-windows-X64-1.4.341.1.exe" `
            -OutFile "$env:RUNNER_TEMP/VulkanSDK.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP/VulkanSDK.exe" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}
          path: build/**/Testing/Temporary/*.log
          if-no-files-found: warn

  clang-tidy:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          destination: ${{ runner.temp }}/ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List

      # Pin clang-tidy version (LLVM 20.1.8) to match local dev (VS2026 ships
      # LLVM 20.1.8). LLVM 19 and 20 differ in `readability-identifier-naming`
      # categorisation of function-local `constexpr` (LLVM 19 lumps them into
      # `LocalConstant`; LLVM 20 has a separate `LocalConstexprVariable`
      # category — `.clang-tidy` sets `LocalConstexprVariableCase = CamelCase + k`
      # for the project convention `kMaxPrec`-style names). Pinning eliminates
      # the skew that produced silent CI-only failures on patterns the local
      # gate accepted.
      #
      # Why @v2.0.9 not @v2: the `@v2` tag was silently resolving to an older
      # v2.0.x that pre-dated LLVM 20 support (added in v2.0.7, additional 20.x
      # versions in v2.0.9). With `@v2 + version: '20'` the action fell back
      # to its newest known version which was LLVM 19.1.7. Explicit `@v2.0.9 +
      # version: '20.1.8'` resolves to LLVM 20.1.8 deterministically.
      - name: Install LLVM 20.1.8 (pinned)
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: '20.1.8'
          directory: ${{ runner.temp }}/llvm-20.1.8

      - name: Verify clang-tidy version
        shell: pwsh
        run: |
          $tidyPath = Join-Path $env:LLVM_PATH 'bin/clang-tidy.exe'
          $version = & $tidyPath --version
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '\b20\.1\.8\b') {
            throw "Expected LLVM 20.1.8 at $tidyPath; got $version"
          }
          Write-Output $version
          "CRD_CI_TIDY=$tidyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-win-tidy-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-win-tidy-
            cpm-${{ runner.os }}-

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/1.4.341.1/windows/vulkansdk-windows-X64-1.4.341.1.exe" `
            -OutFile "$env:RUNNER_TEMP/VulkanSDK.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP/VulkanSDK.exe" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset win-tidy -DCRD_CLANG_TIDY_WARNINGS_AS_ERRORS=ON "-DCLANG_TIDY_EXE=$env:CRD_CI_TIDY"

      - name: Build
        run: cmake --build --preset win-tidy

  clang-cl:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          destination: ${{ runner.temp }}/ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-win-clang-cl-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-win-clang-cl-
            cpm-${{ runner.os }}-

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          # Locate clang-cl robustly across runner-image changes: the GitHub windows-latest image has trimmed the
          # VS-bundled LLVM component (and shifts VS year/edition), which broke the old hard-coded
          # `2022\{Enterprise,Community}\VC\Tools\Llvm\x64\bin` lookup. Prefer the VS-bundled LLVM for ANY VS
          # year/edition, then fall back to the standalone C:\Program Files\LLVM (reliably present on the runner),
          # then to whatever clang-cl is already on PATH (msvc-dev-cmd). Only fail if truly none is found.
          $candidates = @()
          $candidates += Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\x64\bin\clang-cl.exe" `
                          -ErrorAction SilentlyContinue | ForEach-Object { $_.DirectoryName }
          $candidates += "C:\Program Files\LLVM\bin"
          $llvm = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ "clang-cl.exe")) } | Select-Object -First 1
          if (-not $llvm) {
            $cmd = Get-Command clang-cl -ErrorAction SilentlyContinue
            if ($cmd) { $llvm = Split-Path $cmd.Source }
          }
          if (-not $llvm) {
            throw "clang-cl not found (checked VS-bundled LLVM for all editions, C:\Program Files\LLVM, and PATH)"
          }
          Write-Host "Using clang-cl at: $llvm"
          Add-Content -Path $env:GITHUB_PATH -Value $llvm

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/1.4.341.1/windows/vulkansdk-windows-X64-1.4.341.1.exe" `
            -OutFile "$env:RUNNER_TEMP/VulkanSDK.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP/VulkanSDK.exe" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset win-clang-cl

      - name: Build
        run: cmake --build --preset win-clang-cl

      - name: Test
        env:
          CRD_PLATFORM_HEADLESS: '1'
        run: ctest --preset win-clang-cl --output-on-failure --no-tests=error

      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}
          path: build/**/Testing/Temporary/*.log
          if-no-files-found: warn

  linux-gcc:
    runs-on: ubuntu-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-debug, linux-gcc-release, linux-gcc-relwithdebinfo, linux-gcc-asan, linux-gcc-debug-sse2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          destination: ${{ runner.temp }}/ninja

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev \
            glslang-tools \
            libshaderc-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            mesa-common-dev

      - name: Fetch SPIRV-Reflect source
        run: |
          mkdir -p /tmp/vulkan-sdk/Source/SPIRV-Reflect/include/spirv/unified1
          curl -fsSL \
            https://raw.githubusercontent.com/KhronosGroup/SPIRV-Reflect/vulkan-sdk-1.4.341.0/spirv_reflect.h \
            -o /tmp/vulkan-sdk/Source/SPIRV-Reflect/spirv_reflect.h
          curl -fsSL \
            https://raw.githubusercontent.com/KhronosGroup/SPIRV-Reflect/vulkan-sdk-1.4.341.0/spirv_reflect.c \
            -o /tmp/vulkan-sdk/Source/SPIRV-Reflect/spirv_reflect.c
          curl -fsSL \
            https://raw.githubusercontent.com/KhronosGroup/SPIRV-Headers/vulkan-sdk-1.4.341.0/include/spirv/unified1/spirv.h \
            -o /tmp/vulkan-sdk/Source/SPIRV-Reflect/include/spirv/unified1/spirv.h
          echo "VULKAN_SDK=/tmp/vulkan-sdk" >> $GITHUB_ENV

      # apt's libvulkan-dev ships ~1.3.275 headers — too old for the NV extensions the engine drives
      # (VK_NV_cluster_acceleration_structure / cooperative_vector / cooperative_matrix2 / linear_swept_spheres).
      # Compile against current Khronos Vulkan-Headers (pinned to the same SDK tag as Windows); the runtime
      # loader (libvulkan.so) still comes from apt — headers-newer-than-loader is the supported direction.
      - name: Fetch current Vulkan headers
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.341.0 \
            https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cp -r /tmp/vulkan-headers/include /tmp/vulkan-sdk/

      - name: Install matching Vulkan validation layer
        run: |
          validation_dir="$RUNNER_TEMP/cerid-vulkan-validation"
          python3 scripts/install-vulkan-validation.py --destination "$validation_dir"
          echo "VK_LAYER_PATH=$validation_dir/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$validation_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}
          path: build/**/Testing/Temporary/*.log
          if-no-files-found: warn

  windows-shipping:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    steps:
