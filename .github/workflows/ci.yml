name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    strategy:
      fail-fast: false
      matrix:
        preset: [win-debug, win-release, win-asan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  clang-tidy:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-win-tidy-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-win-tidy-
            cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset win-tidy

      - name: Build
        run: cmake --build --preset win-tidy

  clang-cl:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-win-clang-cl-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-win-clang-cl-
            cpm-${{ runner.os }}-

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin"
          }
          if (-not (Test-Path $llvm)) {
            throw "clang-cl not found"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm

      - name: Configure
        run: cmake --preset win-clang-cl

      - name: Build
        run: cmake --build --preset win-clang-cl

  linux-gcc:
    runs-on: ubuntu-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-linux-gcc-debug-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-linux-gcc-debug-
            cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset linux-gcc-debug

      - name: Build
        run: cmake --build --preset linux-gcc-debug
