  linux-gcc-shipping:
    needs: preflight
    if: needs.preflight.outputs.presets_linux_gcc_shipping != '[]'
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_linux_gcc_shipping) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Linux tree links every kernel family once per CPU level into each test program; linux-gcc-asan ran out of
      # root space at link (run 40515770381). Drop the image's preinstalled toolchains that no step here uses.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift             /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev \
            glslang-tools \
            libshaderc-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            mesa-common-dev \
            mesa-vulkan-drivers \
            gdb
          # mesa-vulkan-drivers provides lavapipe, a software Vulkan device: the Vulkan device tests and the Khronos
          # validation layer below run on every push instead of skipping (user decision 2026-10-05).
          # gdb runs the DIAG.9c reverse-debugging and watchpoint routes (the crd-diag-reverse-debug-* CTests).

      - name: Record system package versions
        run: dpkg-query -W -f='${Package} ${Version}\n' libvulkan-dev glslang-tools libshaderc-dev libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev mesa-vulkan-drivers gdb | tee "$RUNNER_TEMP/packages.txt"

      # apt's libvulkan-dev ships ~1.3.275 headers — too old for the NV extensions the engine drives
      # (VK_NV_cluster_acceleration_structure / cooperative_vector / cooperative_matrix2 / linear_swept_spheres).
      # Compile against the pinned Khronos Vulkan-Headers (the same SDK tag as Windows, every file verified by
      # SHA-256 from cmake/pins.json); the runtime loader (libvulkan.so) still comes from apt —
      # headers-newer-than-loader is the supported direction.
      - name: Install pinned Vulkan headers and SPIRV-Reflect
        run: |
          python3 scripts/install-vulkan-headers.py --destination /tmp/vulkan-sdk --download-dir "$RUNNER_TEMP/vulkan-headers"
          echo "VULKAN_SDK=/tmp/vulkan-sdk" >> "$GITHUB_ENV"

      - name: Install matching Vulkan validation layer
        run: |
          validation_dir="$RUNNER_TEMP/cerid-vulkan-validation"
          python3 scripts/install-vulkan-validation.py --destination "$validation_dir"
          echo "VK_LAYER_PATH=$validation_dir/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$validation_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Install pinned sccache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: python3 scripts/install-sccache.py --destination "$RUNNER_TEMP/sccache"

      # The GitHub Actions cache backend, as in the windows job.
      - name: Compiler cache service
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CRD_CACHE_LANE: ${{ matrix.preset }}
          CRD_SCCACHE: ${{ runner.temp }}/sccache/sccache
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const url = process.env.ACTIONS_RESULTS_URL || '';
            const image = [process.env.ImageOS || 'image', process.env.ImageVersion || 'unknown'];
            const common = { SCCACHE_IDLE_TIMEOUT: '0', SCCACHE_IGNORE_SERVER_IO_ERROR: '1' };
            const service = {
              SCCACHE_GHA_ENABLED: 'on', SCCACHE_GHA_VERSION: [process.env.CRD_CACHE_LANE, ...image].join('-'),
              ACTIONS_RESULTS_URL: url, ACTIONS_RUNTIME_TOKEN: token,
              ACTIONS_CACHE_SERVICE_V2: process.env.ACTIONS_CACHE_SERVICE_V2 || '',
            };
            let started = false;
            if (token && url) {
              core.setSecret(token);
              try {
                const options = { env: { ...process.env, ...common, ...service }, ignoreReturnCode: true };
                started = (await exec.exec(process.env.CRD_SCCACHE, ['--start-server'], options)) === 0;
              } catch (error) {
                core.warning(`sccache did not start: ${error.message}`);
              }
            }
            const local = { SCCACHE_GHA_ENABLED: 'off', SCCACHE_GHA_VERSION: '' };
            const chosen = started ? { ...common, ...service } : { ...common, ...local };
            for (const [name, value] of Object.entries(chosen)) {
              core.exportVariable(name, value);
            }
            if (started) {
              const v2 = service.ACTIONS_CACHE_SERVICE_V2 || 'no';
              core.info(`sccache serves ${service.SCCACHE_GHA_VERSION} from the cache service (v2: ${v2})`);
            } else {
              core.warning('no cache service for sccache in this job; the lane builds through an empty local cache');
            }

      - name: Configure
        if: "!contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))"
        run: cmake --preset ${{ matrix.preset }}

      # No precompiled header under the cache (as above); the -flto objects are cached, the link-time optimization of
      # each program is not.
      - name: Configure with the compiler cache
        if: contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: cmake --preset ${{ matrix.preset }} "-DCRD_COMPILER_LAUNCHER=$RUNNER_TEMP/sccache/sccache" -DCRD_ENABLE_PCH=OFF

      # Keep going past a failing unit (`-k 0`): the job still fails, but one run reports every independent failure.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Compiler cache statistics
        if: always() && contains(env.CRD_CACHED_PRESETS, format(' {0} ', matrix.preset))
        run: |
          "$RUNNER_TEMP/sccache/sccache" --show-stats --stats-format json > "$RUNNER_TEMP/sccache.json"
          "$RUNNER_TEMP/sccache/sccache" --show-stats
          "$RUNNER_TEMP/sccache/sccache" --stop-server

      - name: Test inventory
        run: python3 scripts/ci-evidence.py inventory --build-dir build/${{ matrix.preset }}

      - name: Test
        shell: bash
        run: |
          junit="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/Testing/Temporary/ctest-junit.xml"
          set +e
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --output-junit "$junit"
          test_exit=$?
          set -e
          python3 scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit "$test_exit"

      - name: Evidence bundle and summary
        if: always()
        shell: bash
        run: |
          python3 scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/${{ matrix.preset }} \
            --outcome "${{ job.status }}" --output build/${{ matrix.preset }}/evidence \
            --packages "$RUNNER_TEMP/packages.txt" --sccache-stats "$RUNNER_TEMP/sccache.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  windows-native:
    # Complete tier: the native Visual Studio generator (`win-vs`) configures the solution on the VS 2026 image,
    # builds the Debug sandbox profile exactly as the IDE build preset does and runs the repository guards under the
    # multi-config CTest, including the two native-only fixtures (`crd-project-structure-native`,
    # `crd-native-build-profiles`) that no Ninja lane can register. Engine suites stay with the Ninja lanes.
    needs: preflight
    if: needs.preflight.outputs.presets_windows_native != '[]'
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_windows_native) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Record graphics driver identity
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, PNPDeviceID | Format-List | Tee-Object -FilePath "$env:RUNNER_TEMP/adapters.txt"

      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.341.1-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: python scripts/install-vulkan-sdk.py --download-dir "${{ runner.temp }}"

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The native preset enables CRD_PROJECT_SYNC, so the build runs crd-project-sync-check, which requires the
      # synchronization baseline. Only the configure wrapper writes it on completion (docs/design/project-structure-sync.md);
      # a bare `cmake --preset` leaves it absent and the check refuses the build.
      - name: Configure
        run: python scripts/project-sync.py configure --build build/win-vs-debug --preset ${{ matrix.preset }}

      - name: Build the Debug sandbox profile
        run: cmake --build --preset win-vs-debug

      - name: Test inventory
        run: python scripts/ci-evidence.py inventory --build-dir build/win-vs-debug --config Debug

      - name: Test
        shell: pwsh
        run: |
          $junit = "$env:GITHUB_WORKSPACE\build\win-vs-debug\Testing\Temporary\ctest-junit.xml"
          ctest --preset win-vs-debug -R '^crd-(repository-hygiene|master-plan|ci-tiers|repository-tools|developer-workflow|project-structure-sync|build-profiles|module-selection|project-structure-native|native-build-profiles)$' --output-on-failure --no-tests=error --output-junit "$junit"
          $testExit = $LASTEXITCODE
          python scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit $testExit
          exit $LASTEXITCODE

      - name: Evidence bundle and summary
        if: always()
        shell: pwsh
        run: |
          python scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/win-vs-debug `
            --adapters "$env:RUNNER_TEMP/adapters.txt" --outcome "${{ job.status }}" `
            --output build/win-vs-debug/evidence --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  # ARM64 on real NEON hardware (SIMD-DISPATCH, docs/design/ci-tiers.md#arm64-lanes). crd-jobs has no ARM64 fiber
  # context before JOBS-PORT.2, so the presets configure every module whose closure and tests avoid it
  # (CRD_MODULES_WITHOUT=jobs, cmake/CrdModules.cmake); the lanes widen with no workflow edit once it lands. Every
  # kernel family builds portable here and the level probe runs portable and neon, as the forced-level arms do on x64.
  # The image's toolchains only: GCC and Clang, Ubuntu's ninja-build (the pinned Ninja is an x86-64 binary) and gdb
  # for the support/diag watchpoint routes; no compiler cache (the pinned sccache is x86-64 too).
  linux-arm64:
    needs: preflight
    if: needs.preflight.outputs.presets_linux_arm64 != '[]'
    runs-on: ubuntu-24.04-arm
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_linux_arm64) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build gdb clang libclang-rt-18-dev

      - name: Record system package versions
        run: |
          dpkg-query -W -f='${Package} ${Version}\n' ninja-build gdb clang libclang-rt-18-dev g++ \
            | tee "$RUNNER_TEMP/packages.txt"
          # The image's CMake is Kitware's binary, not an apt package.
          cmake --version | head -n 1 | tee -a "$RUNNER_TEMP/packages.txt"
          uname -m | tee -a "$RUNNER_TEMP/packages.txt"
          grep -m1 -o 'asimd' /proc/cpuinfo | tee -a "$RUNNER_TEMP/packages.txt"

      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Keep going past a failing unit (`-k 0`): the job still fails, but one run reports every independent failure.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Test inventory
        run: python3 scripts/ci-evidence.py inventory --build-dir build/${{ matrix.preset }}

      - name: Test
        shell: bash
        run: |
          junit="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/Testing/Temporary/ctest-junit.xml"
          set +e
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --output-junit "$junit"
          test_exit=$?
          set -e
          python3 scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit "$test_exit"

      - name: Evidence bundle and summary
        if: always()
        shell: bash
        run: |
          python3 scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/${{ matrix.preset }} \
            --outcome "${{ job.status }}" --output build/${{ matrix.preset }}/evidence \
            --packages "$RUNNER_TEMP/packages.txt" --summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  # MSVC ARM64 on windows-11-arm, the same module set as linux-arm64. The pinned Ninja is an x64 binary, which the
  # image runs under its x64 emulation; the compiler is the native ARM64 one (vcvarsarm64.bat).
  windows-arm64:
    needs: preflight
    if: needs.preflight.outputs.presets_windows_arm64 != '[]'
    runs-on: windows-11-arm
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.preflight.outputs.presets_windows_arm64) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Ninja 1.11.1
        shell: bash
        run: python scripts/install-ninja.py --destination "$RUNNER_TEMP/ninja" --github-path "$GITHUB_PATH"

      - name: Setup MSVC
        shell: pwsh
        run: python scripts/msvc-dev-env.py --arch arm64 --github-env "$env:GITHUB_ENV"

      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake', 'cmake/CrdPins.cmake', 'cmake/pins.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Keep going past a failing unit (`-k 0`): the job still fails, but one run reports every independent failure.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Test inventory
        run: python scripts/ci-evidence.py inventory --build-dir build/${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: |
          $junit = "$env:GITHUB_WORKSPACE\build\${{ matrix.preset }}\Testing\Temporary\ctest-junit.xml"
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --output-junit "$junit"
          $testExit = $LASTEXITCODE
          python scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit $testExit
          exit $LASTEXITCODE

      - name: Evidence bundle and summary
        if: always()
        shell: pwsh
        run: |
          python scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/${{ matrix.preset }} `
            --outcome "${{ job.status }}" --output build/${{ matrix.preset }}/evidence --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  required:
    name: Required result
    needs: [preflight, repository, windows, clang-tidy, clang-cl, linux-gcc, windows-shipping, windows-clang-cl-shipping, linux-gcc-shipping, windows-native,
      linux-arm64, windows-arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Every expected job ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.preflight.outputs.expected }}
        run: python scripts/ci-tier.py conclude --needs-env NEEDS --expected-env EXPECTED --summary "$GITHUB_STEP_SUMMARY"
