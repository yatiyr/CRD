        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.341.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.4.341.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build the Debug sandbox profile
        run: cmake --build --preset win-vs-debug

      - name: Test inventory
        run: python scripts/ci-evidence.py inventory --build-dir build/win-vs-debug --config Debug

      - name: Test
        shell: pwsh
        run: |
          $junit = "$env:GITHUB_WORKSPACE\build\win-vs-debug\Testing\Temporary\ctest-junit.xml"
          ctest --preset win-vs-debug -R '^crd-(repository-hygiene|master-plan|ci-tiers|repository-tools|developer-workflow|project-structure-sync|build-profiles|module-selection|project-structure-native|native-build-profiles)$' --output-on-failure --no-tests=error --output-junit "$junit"
          $testExit = $LASTEXITCODE
          python scripts/check-registered-failures.py --lane ${{ matrix.preset }} --junit "$junit" --ctest-exit $testExit
          exit $LASTEXITCODE

      - name: Evidence bundle and summary
        if: always()
        shell: pwsh
        run: |
          python scripts/ci-evidence.py bundle --preset ${{ matrix.preset }} --build-dir build/win-vs-debug `
            --adapters "$env:RUNNER_TEMP/adapters.txt" --outcome "${{ job.status }}" `
            --output build/win-vs-debug/evidence --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.preset }}
          path: |
            build/*/evidence/**
            build/**/Testing/Temporary/*.log
            build/**/Testing/Temporary/*.xml
          if-no-files-found: warn

  required:
    name: Required result
    needs: [preflight, repository, windows, clang-tidy, clang-cl, linux-gcc, windows-shipping, windows-clang-cl-shipping, linux-gcc-shipping, windows-native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Every expected job ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.preflight.outputs.expected }}
        run: python scripts/ci-tier.py conclude --needs-env NEEDS --expected-env EXPECTED --summary "$GITHUB_STEP_SUMMARY"
