        run: |
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe" `
            -OutFile VulkanSDK.exe
          Start-Process -FilePath ".\VulkanSDK.exe" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
