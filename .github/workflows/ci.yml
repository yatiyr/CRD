        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev \
            glslang-tools \
            libshaderc-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            mesa-common-dev

      - name: Record system package versions
        run: dpkg-query -W -f='${Package} ${Version}\n' libvulkan-dev glslang-tools libshaderc-dev libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev | tee "$RUNNER_TEMP/packages.txt"

