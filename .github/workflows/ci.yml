      - name: Build
        run: cmake --build --preset win-tidy

  clang-cl:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-win-clang-cl-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-win-clang-cl-
            cpm-${{ runner.os }}-

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin"
          }
          if (-not (Test-Path $llvm)) {
            throw "clang-cl not found"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.3.290.0-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe" `
            -OutFile VulkanSDK.exe
          Start-Process -FilePath ".\VulkanSDK.exe" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\1.3.290.0\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset win-clang-cl

      - name: Build
        run: cmake --build --preset win-clang-cl

  linux-gcc:
    runs-on: ubuntu-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CRD_PLATFORM_HEADLESS: '1'

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-debug, linux-gcc-release, linux-gcc-asan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev \
            glslang-tools \
            libshaderc-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Fetch SPIRV-Reflect source
        run: |
          mkdir -p /tmp/vulkan-sdk/Source/SPIRV-Reflect/include/spirv/unified1
          curl -fsSL \
            https://raw.githubusercontent.com/KhronosGroup/SPIRV-Reflect/vulkan-sdk-1.3.290.0/spirv_reflect.h \
            -o /tmp/vulkan-sdk/Source/SPIRV-Reflect/spirv_reflect.h
          curl -fsSL \
            https://raw.githubusercontent.com/KhronosGroup/SPIRV-Reflect/vulkan-sdk-1.3.290.0/spirv_reflect.c \
            -o /tmp/vulkan-sdk/Source/SPIRV-Reflect/spirv_reflect.c
          curl -fsSL \
            https://raw.githubusercontent.com/KhronosGroup/SPIRV-Headers/vulkan-sdk-1.3.290.0/include/spirv/unified1/spirv.h \
            -o /tmp/vulkan-sdk/Source/SPIRV-Reflect/include/spirv/unified1/spirv.h
          echo "VULKAN_SDK=/tmp/vulkan-sdk" >> $GITHUB_ENV

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.preset }}-
            cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

