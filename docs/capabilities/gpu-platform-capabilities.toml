# ─────────────────────────────────────────────────────────────────────────────
# Cerid GPU-platform capability registry — the MACHINE-READABLE source of truth for
# per-feature maturity + evidence (D-007 §POST-RAF PROGRAMME, prompt §2/§25/§30).
#
# ⛔ THE REGISTRY LEVEL IS THE HONEST CLAIM. D-007 prose must never exceed it.
#
# Maturity — the UNIFIED two-axis model (CEIR-0g; §173 is the law; docs/design/ceir-0g-maturity-and-manifest.md).
# TWO axes, DIFFERENT rulers (ceir-0g §1): a feature carries BOTH during the transition (→ CEIR-13z convergence).
#   `raf_level` (0-7) — today's RAF-asset maturity (the former `level`, renamed at schema=2):
#     L0 catalogued · L1 math/oracle · L2 mechanic · L3 one-backend end-to-end · L4 cross-backend proven
#     · L5 shipped asset · L6 live-authorable (needs CR-D007, NOT yet possible) · L7 production-qualified.
#   `ceir_level` (0-8, or "n/a" for T-class) — how far the feature has climbed as a CEIR PROGRAM (§173):
#     L0 listed · L1 semantics/ADR · L2 IR-op+verifier · L3 reference/one-provider · L4 optimized-on-primary
#     · L5 Vulkan+D3D12 multi-provider proof · L6 shipped engine:// program asset · L7 CR-D007 authoring+reload
#     · L8 production stress/perf/determinism qualification.
# ⛔ The axes are NOT the same ruler: a shipped RAF feature that is NOT (yet) a CEIR program is ceir_level=0
#   (e.g. platform_windowing_input, draw_debug_viz). The scene-raster render assets became CEIR programs at CEIR-16d
#   §128 (E1/E2/E5: record_scene_raster DELETED, scene.raster → record_ceir_render UNCONDITIONALLY — 34-0 census E1/E2/E5);
#   the fullscreen/frame_runtime path converged at F1 (34-0 census F1). Either way the shipped `.frame.toml` render assets
#   ARE CEIR programs (they lower through the CEIR plan path / record_ceir_render / ceir.frame) → they earn a real
#   ceir_level. ceir_level CLASSIFICATION RULE
#   (rule-driven, cited from THIS file's evidence fields, ⛔ never back-dated — ceir-0g §5 Q1):
#     L6 = status=shipped + assets non-empty + BOTH tests_vulkan/tests_dx12 + runs through record_ceir_render/ceir.frame.
#     L5 = cross-backend proven / mature CEIR mechanism, no shipped-asset consumer (ui_effect_graph, hot_reload_*).
#     L3 = one backend (raytrace_pipeline_mechanic). L2 = IR-op/mechanic landed, no shipped program.
#     L0 = every status=target (not built as a CEIR program). T-class → "n/a" (tooling is never a CEIR program, §2a).
#   ⛔ INVARIANT: providers is a CEIR axis — ceir_level ∈ {0, "n/a"} ⇒ providers = [] (a non-CEIR-program has no CEIR
#     provider, even where tests_vulkan/tests_dx12 prove it runs as a RAF/gpu-context path).
# raf_level=level (unchanged) · ceir_level derived above · both shown, NEVER collapsed to one max (§5 Q2).
# §PR-3's standalone ladder is SUPERSEDED (struck in place, CEIR-0f).
# Classification (§PR-4): A pure-asset · A+R asset+runtime · A+E asset+executor · B canonical/backend · T tooling.
# ⚠ COMPILER TRANSFORMS / LANGUAGE FRONTENDS (autodiff, optimizer, transform/rewrite, CHIR) have NO native §PR-4 class
#   (the taxonomy was render-designed) — filed as B-machinery, with: ceir_level = the maturity of the program they
#   PRODUCE (autodiff's device crown, CHIR's lowered module), providers = where that produced program is proven to run
#   ([] for a compile-time-only frontend that does not itself execute). This taxonomy gap is a candidate for the
#   schema=3 revision (with the raf_level-retirement question) — recorded, user-gated, NOT decided here.
#
# Seeded 2026-08-06 from a code+test audit (NOT prose). Load-bearing fields (raf_level, ceir_level,
# providers, determinism_tier, classification, status, band, assets, tests_*, hot_reload_tests) are
# always present; documentary fields (references, subcategory, ...) are present-iff-meaningful.
# ✅ The CI generator EXISTS (CEIR-0g §4 step-4): tools/ceir_capability_matrix/gen_matrix.py emits
# docs/generated/gpu-platform-capability-matrix.md + runs HARD checks (vocab/range/providers-invariant/
# stale-path/load-bearing-presence) and review flags; gated by the crd-ceir-capability-matrix-{drift,validator} ctests.
#
# ⚠ CEILINGS (the two axes cap at different rungs, both honest):
#   raf_level ceiling = L5 today: raf L6 (live-authorable) requires a CR-D007 inspection/authoring schema (D7E, unstarted).
#   ceir_level ceiling = L6 today (shipped engine:// CEIR program asset): CEIR-L7 (CR-D007 authoring+reload) unlocks with
#   the D7E editor widgets, which DECISION C RULED (2026-09-11, C2) are the I2D-9 slice — so L7 is now an I2D-band
#   obligation on the I2D-9 timeline (ADR-0107), NOT an open CEIR gate. CEIR-L8 (production stress/perf/determinism
#   qualification): its perf/determinism half is the CEIR-35 DoD (Q7 perf boards shipped 2026-09-11, Q1/Q3/Q4/Q8
#   determinism re-verified), and the whole-engine FEATURE-quality half (DECISION A, RESOLVED 2026-09-11) routes to the
#   feature bands — so an L8 CLAIM for a given feature rides its owning band, not a single CEIR gate. No feature CLAIMS L7+
#   until its gating band lands; both former "decisions" are now resolved (context.md §Gated / census §9 / 33-0 census §3).
# ⚠ SCOPE (2026-09-11): this manifest is RENDER/UI-centric (seeded from the RAF audit). The CEIR-native substrate
#   families — ceir.audio (CEIR-31) · tensor-ML/NRC · autodiff (CEIR-25) · ceir.dist (CEIR-30) · CUDA-Graphs (CEIR-29)
#   · CHIR (CEIR-32) — do NOT yet have rows here; adding them (evidence in each band-close log) is the tracked next step.
# ─────────────────────────────────────────────────────────────────────────────

schema = 2                   # CEIR-0g §4: two-axis migration (level→raf_level; +ceir_level/providers/determinism_tier)
generated = false            # hand-seeded; a generator will own regeneration later
audit_date = "2026-08-06"    # raf-axis seed; ceir_level/providers added 2026-09-11 (schema=2)

# ── field contract every feature must carry (documentation; not enforced until CI) ──
# id, category, subcategory, definition, raf_level, ceir_level, providers, determinism_tier, classification,
# dependencies, ckir_capabilities, command_families, executors, runtime_systems, backend_capabilities,
# assets, tests_vulkan, tests_dx12, tests_cross_backend, hot_reload_tests,
# editor_support, quality_perf_gates, fallback, band, status, references, limitations
# NEW at schema=2: providers = which CEIR execution PROVIDER-CLASS(es) run it — the `ProviderClass` enum
#   (semantics.hpp: host / gpu / npu / media / external; §69/ADR-0109), NOT backends. A render feature on Vulkan+D3D12
#   is the "gpu" provider (the vk/dx12 BACKEND split lives in tests_vulkan/tests_dx12, an orthogonal axis); a host DSP
#   is "host"; CUDA(-Graphs) is "gpu". Empty where nothing runs on a CEIR provider yet. determinism_tier = the §27
#   DeterminismClass (BitExact / DeterministicWithinTarget / DeterministicWithinBackend / Nondeterministic /
#   ExternalNondeterminism); "" = no claim (conservative), filled ONLY where a gate proves the class (CEIR-4b owns the
#   class→ADR-0098-tier alignment). Render/UI rows are "" today — honest, not lazy (no per-feature determinism gate).

