assets = ["assets/ceir/attention.ceir"]
tests_vulkan = ["tests/execution/ceir-gpu/test_band24_gate.cpp + tests/execution/ceir-gpu/test_expand_ml.cpp (ml.mlp/attention == oracle, Vulkan)"]
tests_dx12 = ["tests/execution/ceir-gpu-dx12/test_ceir_pipeline_dx12.cpp (ml.mlp/attention == oracle, DX12)"]
tests_cross_backend = ["26d-2c non-32-width ml.mlp Vk+DX12 == float oracle; 26d-3c generic attention (Sq=3,Sk=5,D=4) Vk+DX12 == SDPA oracle (tolerance); [kir][cuda][gpu][attention] CUDA leg"]
hot_reload_tests = []
editor_support = "none"
