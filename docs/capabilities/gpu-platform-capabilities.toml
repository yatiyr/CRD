[feature.forward_basic]
category = "render_pipeline"
subcategory = "forward"
definition = "Basic forward renderer: opaque scene raster into color+depth, no shadows."
level = 5
classification = "A"
dependencies = []
ckir_capabilities = ["vs", "fs", "brdf"]
command_families = ["raster.draw", "raster.draw_indexed"]
executors = ["scene.raster", "present"]
runtime_systems = ["scene draw-list extraction"]
