# ─────────────────────────────────────────────────────────────────────────────
# Cerid GPU-platform capability registry — the MACHINE-READABLE source of truth for
# per-feature maturity + evidence (D-007 §POST-RAF PROGRAMME, prompt §2/§25/§30).
#
# ⛔ THE REGISTRY LEVEL IS THE HONEST CLAIM. D-007 prose must never exceed it.
#
# Maturity (see D-007 §PR-3): L0 catalogued · L1 math/oracle · L2 mechanic · L3 one-backend
# end-to-end · L4 cross-backend proven · L5 shipped asset · L6 live-authorable (needs CR-D007,
# NOT yet possible) · L7 production-qualified.
# Classification (§PR-4): A pure-asset · A+R asset+runtime · A+E asset+executor · B canonical/backend · T tooling.
#
# Seeded 2026-08-06 from a code+test audit (NOT prose). Every `[feature.<id>]` carries the full
# field set even where empty ("" / []), so a future CI generator
# (docs/generated/gpu-platform-capability-matrix.md — not built yet) can emit the matrix, missing
# backend coverage, assets-without-tests, claimed-L5+-without-hot-reload/editor, and stale refs.
#
# ⚠ Nothing exceeds L5 today: L6 requires a CR-D007 inspection/authoring schema (band D7E, unstarted).
# ─────────────────────────────────────────────────────────────────────────────

schema = 1
generated = false            # hand-seeded; a generator will own regeneration later
audit_date = "2026-08-06"

# ── field contract every feature must carry (documentation; not enforced until CI) ──
# id, category, subcategory, definition, level, classification, dependencies,
# ckir_capabilities, command_families, executors, runtime_systems, backend_capabilities,
# assets, tests_vulkan, tests_dx12, tests_cross_backend, hot_reload_tests,
# editor_support, quality_perf_gates, fallback, band, status, references, limitations

