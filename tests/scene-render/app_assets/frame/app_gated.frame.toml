# app_gated.frame.toml — a frame GATED on a capability the engine does not model (RAF-10 requirement 9).
#
# `requires = ["app_wants_feature_x"]` names a capability `SceneRenderer::capability` does not know — and an unknown
# capability is UNSUPPORTED (false), by rule, so this graph's body NEVER records on any device: selection is
# deterministic and inspectable, never a silent guess. Selecting it therefore always steps DOWN to the app fallback
# (`app://frame/app_basic`) and reports it. The pixel readback proves the step-down landed on the fallback (this
# graph's own green clear must never appear). This is the negative half of the capability-tier proof; the positive
# half is every ungated app frame rendering its own body when its (met) requirements allow.

schema   = 1
name     = "app://frame/app_gated"
requires = ["app_wants_feature_x"]
fallback = "app://frame/app_basic"

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
writes        = ["@output"]
technique     = "app_tint"
material_pass = "Forward"
clear_color   = [0.03, 0.22, 0.03, 1.0]   # green — must NEVER appear (this body cannot record; it always steps down)
clear_depth   = 0.0
depth         = "GreaterEqual"
