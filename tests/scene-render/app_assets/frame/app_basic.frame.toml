# app_basic.frame.toml — the APP's capability FALLBACK graph (RAF-10 requirement 9).
#
# A frame that declares `requires = [...]` names THIS graph in its `fallback`. When the engine reports the required
# capability is unavailable (`SceneRenderer::capability`), the recorder steps DOWN to this graph and REPORTS it —
# never a silent half-render. It is a plain, self-contained app forward pass with a DISTINCT clear colour so the
# step-down is visible in a pixel readback (the primary and the fallback cannot be confused).

schema = 1
name   = "app://frame/app_basic"

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
writes        = ["@output"]
technique     = "app_tint"
material_pass = "Forward"
clear_color   = [0.22, 0.03, 0.03, 1.0]   # DISTINCT reddish — proves the step-down landed here, not the primary
clear_depth   = 0.0
depth         = "GreaterEqual"
