# app_authored.frame.toml — a FULLY APPLICATION-AUTHORED frame graph (RAF-10 requirement 7).
#
# Nothing engine-owned here: the app declares its own draw list and its own single forward pass, selects its OWN
# shading technique (`app_tint`, supplied by the app through `define_technique`) and — via `set_scene_material` —
# its OWN surface (`app://material/app_scene`). Selected by `set_frame_graph("app://frame/app_authored")`, resolved
# through the App mount (`set_app_asset_root`), cooked and recorded by the SAME machinery an engine default uses.
# This is the "an application authors its own pipeline" proof: one asset edit, no engine rendering-code change.

schema = 1
name   = "app://frame/app_authored"

[[draw_list]]
name = "visible_geometry"
all  = ["MeshRenderer", "Transform"]
cull = "frustum"
sort = "material"

[[pass]]
name          = "forward"
kind          = "raster.geometry"
draw_list     = "visible_geometry"
writes        = ["@output"]
technique     = "app_tint"       # the app's OWN shading technique (define_technique + set_forward_technique)
material_pass = "Forward"
clear_color   = [0.05, 0.06, 0.09, 1.0]
clear_depth   = 0.0
depth         = "GreaterEqual"   # reverse-Z
