# crd-qmux-crate-peer: a QMux endpoint over the `qmux` crate and rustls, the peer of crd-qmux-peer in qmux_interop.py
# (4.2a; docs/design/network-foundation.md#qmux). Built by tests/foundation/net/CMakeLists.txt (CRD_BUILD_QMUX_VS_CRATE)
# with the pinned Rust toolchain (cmake/pins.json tools/rust-linux-x64) and `cargo build --locked`: every crate comes
# from crates.io at the version and SHA-256 the committed Cargo.lock names (tools/qmux-crates).
[package]
name = "crd-qmux-crate-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "crd-qmux-crate-peer"
path = "src/main.rs"

[dependencies]
bytes = "=1.11.1"
qmux = { version = "=0.6.6", default-features = false, features = ["tls", "ws"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = "=0.23.46"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
web-transport-trait = "=0.5.2"

[profile.release]
debug = 1
overflow-checks = true
panic = "abort"
