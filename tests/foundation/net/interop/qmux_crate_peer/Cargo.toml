# crd-qmux-crate-peer: a QMux endpoint over the `qmux` crate and rustls, or over WebSockets on the `h2` crate's HTTP/2
# or the `h3` crate's HTTP/3 over Quinn, the peer of crd-qmux-peer and crd-quic-peer in qmux_interop.py (4.2a;
# docs/design/network-foundation.md#qmux). Built by tests/foundation/net/CMakeLists.txt (CRD_BUILD_QMUX_VS_CRATE) with
# the pinned Rust toolchain (cmake/pins.json tools/rust-linux-x64) and `cargo build --locked`: every crate comes from
# crates.io at the version and SHA-256 the committed Cargo.lock names (tools/qmux-crates), except h3 and h3-quinn,
# which Cargo takes by `--config patch.crates-io` from the SHA-256-pinned source archive of the h3 repository
# (packages/h3-crates): RFC 9220's `:protocol` value is on its main branch only.
[package]
name = "crd-qmux-crate-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "crd-qmux-crate-peer"
path = "src/main.rs"

[dependencies]
bytes = "=1.11.1"
h2 = "=0.4.20"
h3 = { version = "=0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "=0.0.10"
qmux = { version = "=0.6.6", default-features = false, features = ["tls", "ws"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = "=0.23.46"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
web-transport-trait = "=0.5.2"

[profile.release]
debug = 1
overflow-checks = true
panic = "abort"
